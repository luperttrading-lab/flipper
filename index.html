<style>
  :root {
    color-scheme: dark;
    --bg: #0b1420;
    --table: #12233a;
    --rail: #5fb8d6;
    --flip: #ffb347;
    --bump: #e2557f;
    --ink: #e8eef5;
    --muted: #7d93ab;
    --btn: #1b3050;
    --btn-on: #ffb347;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    padding-inline: 16px;
    box-sizing: border-box;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-block: calc(env(safe-area-inset-top, 0px) + 10px) 6px;
    font-variant-numeric: tabular-nums;
  }
  .score { font-family: "Bungee", "Arial Black", sans-serif; font-size: 22px; color: var(--flip); }
  .balls { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
  canvas { touch-action: none; display: block; border-radius: 14px; }
  .controls {
    display: flex;
    gap: 16px;
    padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  .controls button {
    flex: 1;
    height: 84px;
    border: 0;
    border-radius: 42px;
    background: var(--btn);
    color: var(--ink);
    font: 600 15px system-ui, sans-serif;
    letter-spacing: .06em;
    text-transform: uppercase;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .controls button.on { background: var(--btn-on); color: #1a1206; }
  .controls { align-items: center; }
  .controls #fire {
    flex: 0 0 76px; height: 76px; border-radius: 50%;
    background: #8e1d2c; color: #ffe3e6; font-size: 12px; letter-spacing: .04em;
  }
  .controls #fire.on { background: #ff5566; color: #2a0409; }
  .controls #fire.bereit { animation: puls 1s ease-in-out infinite; }
  @keyframes puls { 50% { box-shadow: 0 0 0 8px rgba(224, 52, 74, .35); } }
  @media (prefers-reduced-motion: reduce) { .controls #fire.bereit { animation: none; box-shadow: 0 0 0 4px rgba(224, 52, 74, .5); } }
  .controls button:focus-visible { outline: 3px solid var(--rail); outline-offset: 2px; }
  .meta { display: flex; gap: 12px; align-items: baseline; }
  .ver {
    font-size: 13px; color: var(--muted); background: none; border: 0; padding: 8px 4px;
    text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer;
  }
  /* Update-Banner: überlagert (fixed), schiebt nichts */
  .update {
    position: fixed; left: 12px; right: 12px; top: max(env(safe-area-inset-top), 12px); z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #34c759; color: #06240e;
    padding: 12px 14px; border-radius: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    opacity: 0; transition: opacity .35s ease; pointer-events: none;
  }
  /* Start-Schirm: ein Tipp darauf schaltet auf iOS den Ton frei */
  .start {
    position: fixed; inset: 0; z-index: 25;
    display: flex; align-items: center; justify-content: center;
    background: rgba(11, 20, 32, .72);

  .start[hidden] { display: none; }
  .start span {
    font-family: "Bungee", "Arial Black", sans-serif; font-size: 22px; color: var(--flip);
    padding: 18px 26px; border: 2px solid var(--flip); border-radius: 16px;

  .update.an { opacity: 1; pointer-events: auto; }
  .update[hidden] { display: none; }
  .update.info { background: #2d2d33; color: #f2f2f7; font-weight: 500; }
  .update .btn { border: 0; border-radius: 10px; padding: 8px 14px; font: 600 15px system-ui, sans-serif; background: #06240e; color: #fff; }
  @media (prefers-reduced-motion: reduce) { .update { transition: none; } }

<script>
// ---------- Ton (Web Audio, synthetisch, keine Dateien) ----------
const sfx = (() => {
  let ac = null, master = null, an = true;
  try { an = localStorage.getItem('flipper.ton') !== 'aus'; } catch (_) {}
  const tonEl = document.getElementById('ton');
  const zeige = () => { tonEl.textContent = an ? 'Ton an' : 'Ton aus'; };
  zeige();

  // iOS erlaubt Ton erst nach einer Berührung: Kontext beim ersten Antippen starten
  function neu() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { if (ac) ac.close(); } catch (_) {}
    ac = new AC(); master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
  }
  function unlock() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
    try {
      if (!ac || ac.state === 'closed') neu();
      if (!ac) return;
      if (ac.state !== 'running') {
        const p = ac.resume();
        if (p && p.catch) p.catch(() => {});
        // stiller Mini-Ton: schaltet die Ausgabe auf iOS zuverlässig frei
        const b = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource();
        src.buffer = b; src.connect(ac.destination); src.start(0);
      }
    } catch (_) { ac = null; }
  }
  // iOS zählt nur Loslassen/Klick/Taste als Nutzeraktion – nur dort freischalten
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(ev =>
    window.addEventListener(ev, unlock, { capture: true, passive: true }));

  // Stilles HTML-Audio in Schleife: stellt iOS auf „Medienwiedergabe“ um,
  // damit Web Audio auch bei Stummschalter und nach Unterbrechungen hörbar bleibt
  function stilleWav() {
    const rate = 8000, n = rate / 2, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
    const str = (o, t) => { for (let i = 0; i < t.length; i++) b[o + i] = t.charCodeAt(i); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    str(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
    let bin = ''; for (const x of b) bin += String.fromCharCode(x);
    return 'data:audio/wav;base64,' + btoa(bin);
  }
  const medien = new Audio(stilleWav());
  medien.loop = true; medien.setAttribute('playsinline', '');
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { try { medien.pause(); } catch (_) {} }
  });

  // Start-/Pause-Schirm: beim Öffnen und nach jedem Zurückholen aus dem Hintergrund.
  // Der Tipp darauf baut den Tonkanal frisch auf (iOS meldet nach Unterbrechungen oft
  // 'running', spielt aber nichts mehr).
  const startEl = document.getElementById('start');
  let frisch = true;
  startEl.addEventListener('click', () => {
    if (an) {
      try { const p = medien.play(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
      if (frisch) { neu(); frisch = false; }
      unlock();
      setTimeout(() => api.bumper(2), 80);
    }
    startEl.hidden = true;
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      frisch = true;
      document.getElementById('start-text').textContent = 'Pause – antippen';
      startEl.hidden = false;
    }
  });

  // Umschalten mit Rückmeldung: Probeton + Zustand im Banner (hilft auch bei der Fehlersuche)
  tonEl.addEventListener('click', () => {
    an = !an; zeige();
    try { localStorage.setItem('flipper.ton', an ? 'an' : 'aus'); } catch (_) {}
    if (!an) { window.showInfo && window.showInfo('Ton aus', 2); return; }
    setTimeout(() => {
      const st = ac ? ac.state : 'nicht verfügbar';
      try { const p = medien.play(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
      if (st === 'running') { api.bumper(0); window.showInfo && window.showInfo('Ton an · Kanal ' + st, 2); }
      else window.showInfo && window.showInfo('Ton blockiert (' + st + ') – einmal auf den Tisch tippen', 4);
    }, 150);
  });

  function spiele(fn) {
    if (!an || !ac) return;
    if (ac.state === 'running') { fn(); return; }
    const p = ac.resume();
    if (p && p.then) p.then(() => { if (ac.state === 'running') fn(); }).catch(() => {});
  }

  function ton(typ, f0, f1, dauer, laut, start = 0) {
    const t = ac.currentTime + start;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = typ;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dauer);
    g.gain.setValueAtTime(laut, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dauer);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dauer + 0.02);
  }
  function rauschen(dauer, laut, filterF0, filterF1, q = 1) {
    const t = ac.currentTime, n = Math.floor(ac.sampleRate * dauer);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.Q.value = q;
    bp.frequency.setValueAtTime(filterF0, t);
    bp.frequency.exponentialRampToValueAtTime(filterF1, t + dauer);
    g.gain.setValueAtTime(laut, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dauer);
    src.connect(bp).connect(g).connect(master);
    src.start(t);
  }

  // Drei Bumper = C-Dur-Dreiklang, jeder mit eigener Klangfarbe
  const BUMPER = [
    { typ: 'square',   f: 523.25 },   // C5
    { typ: 'triangle', f: 659.25 },   // E5
    { typ: 'sawtooth', f: 783.99 },   // G5
  ];

  const api = {
    // Flipper: kurzes mechanisches Klacken, tief und trocken
    flipper() { spiele(() => {
      rauschen(0.05, 0.5, 2500, 800, 2);
      ton('sine', 140, 60, 0.08, 0.6);
    }); },
    // Abschuss: aufsteigendes Zischen, lauter und höher je stärker gespannt
    schuss(staerke) { spiele(() => {
      rauschen(0.35, 0.25 + 0.35 * staerke, 400, 3000 + 3000 * staerke, 0.8);
      ton('sine', 180, 420 + 400 * staerke, 0.3, 0.3);
    }); },
    // Klappziel/Stehziel: heller, kurzer Doppel-Pieps
    ziel() { spiele(() => {
      ton('square', 1046, 1046, 0.05, 0.12);
      ton('square', 1318, 1318, 0.06, 0.1, 0.05);
    }); },
    // Obere Gasse / Umlauf: kurzes Aufwärts-Glissando
    gasse() { spiele(() => { ton('triangle', 600, 1200, 0.12, 0.18); }); },
    // Schleuder: trockener, harter Schlag
    schleuder() { spiele(() => {
      rauschen(0.04, 0.45, 3500, 1500, 3);
      ton('square', 220, 110, 0.05, 0.18);
    }); },
    // Rampe: aufsteigende Tonfolge wie ein Alarm
    rampe() { spiele(() => {
      [392, 523, 659, 784].forEach((f, i) => ton('sawtooth', f, f, 0.09, 0.13, i * 0.08));
    }); },
    // Schädel-Loch: tiefes Brummen
    loch() { spiele(() => {
      ton('sawtooth', 110, 55, 0.6, 0.25);
      ton('sine', 220, 110, 0.4, 0.2);
    }); },
    // Auswurf aus dem Loch: dumpfer Stoß
    auswurf() { spiele(() => {
      rauschen(0.08, 0.5, 800, 300, 1.5);
      ton('sine', 90, 50, 0.12, 0.4);
    }); },
    bumper(i) { spiele(() => {
      const b = BUMPER[i % BUMPER.length];
      ton(b.typ, b.f, b.f * 1.02, 0.18, 0.22);
      ton('sine', b.f * 2, b.f * 2, 0.08, 0.12);
    }); },
  };
  return api;
})();
</script>
<script>
(() => {
  // ================= Zero Hour – Tisch, Physik, Regeln =================
  // Logische Tischgröße (px), wird auf den Bildschirm skaliert
  const W = 400, H = 760;
  const R = 9;                  // Kugelradius
  const G = 1150;               // Schwerkraft (px/s²), entspricht Tischneigung
  const STEPS = 12;             // Physik-Substeps pro Frame
  const REST_WALL = 0.5, REST_FLIP = 0.3;
  const LANE_X = 364;           // Trennwand Abschussrinne (rechts)
  const SHOOT_X = 378, SHOOT_Y = 750;
  const RAMP_T = 0.75;          // Fahrzeit über eine Rampe (s)

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const ballsEl = document.getElementById('balls');

  // ---------- Geometrie ----------
  // Wände: {x1,y1,x2,y2, nurRunter?: Einweg-Tor, kick?: Schleuder}
  const walls = [];
  const seg = (x1, y1, x2, y2, extra = {}) => walls.push({ x1, y1, x2, y2, ...extra });
  function bogen(cx, cy, r, a0, a1, n) {
    for (let i = 0; i < n; i++) {
      const b0 = a0 + (a1 - a0) * i / n, b1 = a0 + (a1 - a0) * (i + 1) / n;
      seg(cx + r * Math.cos(b0), cy + r * Math.sin(b0), cx + r * Math.cos(b1), cy + r * Math.sin(b1));
    }
  }
  const PI = Math.PI;
  // Gehäuse: Bogen oben, Seitenwände, Boden der Abschussrinne
  bogen(202, 200, 190, PI, 2 * PI, 30);
  seg(12, 200, 12, 760);
  seg(392, 200, 392, 760);
  seg(LANE_X, 300, LANE_X, 760);
  seg(LANE_X, 760, 392, 760);
  // Einweg-Tor oben an der Abschussrinne: Kugel darf hinaus, fällt aber nicht zurück
  seg(392, 282, 366, 300, { nurRunter: true });

  // Umlauf links („Fluchtweg“): Innenführung
  seg(58, 200, 58, 470);
  bogen(202, 200, 144, PI, PI * 1.25, 6);
  // Umlauf rechts („Verfolgungsschleife“): Innenführung + Abweiser ins Spielfeld
  seg(326, 200, 326, 420);
  bogen(202, 200, 124, PI * 1.75, PI * 2, 6);
  seg(364, 402, 330, 446);
  // Unten am linken Umlauf: Kugel wird in die linke Rückkehrgasse geführt
  seg(12, 470, 40, 574);

  // Obere Durchlaufgassen: vier Pfosten bilden drei Gassen
  for (const x of [148, 184, 220, 256]) seg(x, 52, x, 90);

  // Schädel-Gasse links oben, Loch am Ende
  seg(138, 362, 124, 248);
  seg(58, 232, 124, 248);
  const SKULL = { x: 90, y: 256 };

  // Seitengassen unten
  seg(40, 578, 40, 650);                  // links: Trennung Aus-/Rückkehrgasse
  seg(40, 650, 117, 680);                 // links: Führung endet auf dem Flipper-Drehpunkt
  seg(336, 578, 336, 650);                // rechts
  seg(336, 650, 259, 680);
  // Schleudern (Dreiecke über den Flippern), Schlagseite = kick
  const slings = [
    { pts: [[70, 572], [70, 628], [104, 648]], seite: 1 },
    { pts: [[306, 572], [306, 628], [272, 648]], seite: -1 },
  ];
  for (const s of slings) {
    const [a, b, c] = s.pts;
    seg(a[0], a[1], b[0], b[1]);
    seg(b[0], b[1], c[0], c[1]);
    seg(c[0], c[1], a[0], a[1], { kick: s });
  }

  // Pfosten an den Rampeneinläufen
  const posts = [
    { x: 140, y: 405, r: 5 }, { x: 172, y: 405, r: 5 },
    { x: 262, y: 395, r: 5 }, { x: 294, y: 395, r: 5 },
  ];

  // Pop-Bumper oben
  const bumpers = [
    { x: 190, y: 150, r: 18, flash: 0 },
    { x: 252, y: 162, r: 18, flash: 0 },
    { x: 218, y: 212, r: 18, flash: 0 },
  ];

  // Klappziele in der Mitte (fallen beim Treffer weg)
  const drops = [180, 205, 230].map(x => ({ x, y: 330, w: 22, unten: false }));
  // Stehziele rechts
  const standups = [470, 500, 530].map(y => ({ x: 358, y, h: 20, an: false }));

  // Rampen (vorerst als Tunnel: Einfahrt → Fahrt über Bahn → Ausfahrt in die Rückkehrgasse)
  const ramps = [
    { name: 'links', ein: { x0: 145, x1: 167, y: 405 },
      pfad: [[156, 400], [150, 70], [380, 180], [321, 585]], aus: { x: 321, y: 585, vx: 0, vy: 140 } },
    { name: 'rechts', ein: { x0: 267, x1: 289, y: 395 },
      pfad: [[278, 390], [250, 60], [10, 190], [55, 585]], aus: { x: 55, y: 585, vx: 0, vy: 140 } },
  ];
  const bez = (p, t) => {
    const u = 1 - t;
    return [
      u * u * u * p[0][0] + 3 * u * u * t * p[1][0] + 3 * u * t * t * p[2][0] + t * t * t * p[3][0],
      u * u * u * p[0][1] + 3 * u * u * t * p[1][1] + 3 * u * t * t * p[2][1] + t * t * t * p[3][1],
    ];
  };

  // Flipper
  const FL = 58;
  const flippers = [
    { px: 119, py: 688, side: 1, a: 0.5, prev: null, on: false },
    { px: 257, py: 688, side: -1, a: 0.5, prev: null, on: false },
  ];
  const A_REST = 0.5, A_UP = -0.45, A_SPEED = 22; // rad, rad/s
  const tip = f => ({ x: f.px + f.side * FL * Math.cos(f.a), y: f.py + FL * Math.sin(f.a) });

  // ---------- Zustand ----------
  let ball, score = 0, ballNo = 1, gameOver = false, loaded = true, zeit = 0;
  let bonus = 0, multi = 0, stufe = 1;          // multi: Index in MULTI
  const MULTI = [1, 2, 4, 6, 8];
  const topLanes = [false, false, false];
  const cool = {};                              // Abklingzeiten der Schalter
  let dropReset = 0, meldung = null;

  function newBall() { ball = { x: SHOOT_X, y: SHOOT_Y, vx: 0, vy: 0, rampe: null, halt: 0 }; loaded = true; }
  newBall();

  function updateHud() {
    scoreEl.textContent = score.toLocaleString('de-DE');
    ballsEl.textContent = gameOver ? 'Game over' : `Kugel ${ballNo} / 3`;
  }
  updateHud();

  function punkte(n, b = 1000) { score += n; bonus += b; updateHud(); }
  function melde(text, sek = 1.6) { meldung = { text, bis: zeit + sek }; }
  function frei(key, sek) {                      // Schalter nur einmal je Abklingzeit
    if ((cool[key] || 0) > zeit) return false;
    cool[key] = zeit + sek; return true;
  }

  // ---------- Kollision ----------
  function collideSeg(x1, y1, x2, y2, rad, rest, svx = 0, svy = 0) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = ((ball.x - x1) * dx + (ball.y - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    let nx = ball.x - cx, ny = ball.y - cy;
    const d = Math.hypot(nx, ny);
    if (d >= rad || d === 0) return null;
    nx /= d; ny /= d;
    ball.x = cx + nx * rad; ball.y = cy + ny * rad;
    // Relativgeschwindigkeit zur (evtl. bewegten) Oberfläche
    const sx = svx * t, sy = svy * t;
    const rvx = ball.vx - sx, rvy = ball.vy - sy;
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      ball.vx -= (1 + rest) * vn * nx;
      ball.vy -= (1 + rest) * vn * ny;
    }
    return { nx, ny, vn };
  }
  function collideCircle(cx, cy, r, rest) {
    const dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy), min = r + R;
    if (d >= min || d === 0) return null;
    const nx = dx / d, ny = dy / d;
    ball.x = cx + nx * min; ball.y = cy + ny * min;
    const vn = ball.vx * nx + ball.vy * ny;
    if (vn < 0) { ball.vx -= (1 + rest) * vn * nx; ball.vy -= (1 + rest) * vn * ny; }
    return { nx, ny, vn };
  }

  // ---------- Regeln ----------
  function trefferDrop(i) {
    drops[i].unten = true;
    punkte(25000); sfx.ziel();
    if (drops.every(d => d.unten)) {
      punkte(100000, 5000); melde('ZIELE KOMPLETT 100.000');
      dropReset = zeit + 1.2;
    }
  }
  function trefferStandup(i) {
    standups[i].an = true;
    punkte(10000); sfx.ziel();
    if (standups.every(s => s.an)) {
      punkte(50000, 5000); melde('STEHZIELE 50.000');
      standups.forEach(s => { s.an = false; });
    }
  }
  function topLane(i) {
    if (!topLanes[i]) { topLanes[i] = true; punkte(10000); sfx.gasse(); }
    if (topLanes.every(Boolean)) {
      topLanes.fill(false);
      if (multi < MULTI.length - 1) multi++;
      melde(`BONUS ${MULTI[multi]}X`);
    }
  }
  function rampe(r) {
    if (stufe < 5) stufe++;
    punkte(50000 * stufe, 5000);
    melde(`ALARMSTUFE ${stufe}`);
    sfx.rampe();
    ball.rampe = { r, t: 0 };
  }
  function schaedel() {
    const n = 50000 + 25000 * stufe;
    punkte(n, 5000); melde(`SCHÄDEL ${n.toLocaleString('de-DE')}`);
    sfx.loch();
    ball.x = SKULL.x; ball.y = SKULL.y; ball.vx = 0; ball.vy = 0;
    ball.halt = 1.2;
  }

  // ---------- Physik ----------
  function step(dt) {
    zeit += dt;
    for (const f of flippers) {
      const target = f.on ? A_UP : A_REST;
      f.prev = tip(f);
      const da = target - f.a, maxd = A_SPEED * dt;
      f.a += Math.max(-maxd, Math.min(maxd, da));
    }
    if (dropReset && zeit > dropReset) { drops.forEach(d => { d.unten = false; }); dropReset = 0; }

    if (loaded) { ball.x = SHOOT_X; ball.y = SHOOT_Y; ball.vx = 0; ball.vy = 0; return; }

    // Auf der Rampe: Kugel folgt der Bahn, keine Physik
    if (ball.rampe) {
      ball.rampe.t += dt;
      if (ball.rampe.t >= RAMP_T) {
        const a = ball.rampe.r.aus;
        ball.x = a.x; ball.y = a.y; ball.vx = a.vx; ball.vy = a.vy; ball.rampe = null;
      }
      return;
    }
    // Im Schädel-Loch: festhalten, dann nach unten auswerfen
    if (ball.halt > 0) {
      ball.halt -= dt;
      if (ball.halt <= 0) { ball.vx = 70; ball.vy = 330; cool.schaedel = zeit + 1; sfx.auswurf(); }
      return;
    }

    ball.vy += G * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    for (const w of walls) {
      if (w.nurRunter && ball.vy <= 0) continue;
      const c = collideSeg(w.x1, w.y1, w.x2, w.y2, R, REST_WALL);
      if (c && w.kick && -c.vn > 60 && frei('sling' + w.kick.seite, 0.15)) {
        ball.vx += c.nx * 420; ball.vy += c.ny * 420;
        w.kick.flash = 1;
        punkte(1000, 500); sfx.schleuder();
      }
    }
    for (const p of posts) collideCircle(p.x, p.y, p.r, REST_WALL);

    for (const [bi, b] of bumpers.entries()) {
      const c = collideCircle(b.x, b.y, b.r, 1);
      if (c) {
        ball.vx += c.nx * 280; ball.vy += c.ny * 280;
        if (frei('bumper' + bi, 0.08)) { punkte(5000, 500); sfx.bumper(bi); }
        b.flash = 1;
      }
    }
    drops.forEach((d, i) => {
      if (d.unten) return;
      if (collideSeg(d.x - d.w / 2, d.y, d.x + d.w / 2, d.y, R + 3, REST_WALL)) trefferDrop(i);
    });
    standups.forEach((s, i) => {
      const c = collideSeg(s.x, s.y - s.h / 2, s.x, s.y + s.h / 2, R + 2, REST_WALL);
      if (c && -c.vn > 40 && frei('stand' + i, 0.3)) trefferStandup(i);
    });

    for (const f of flippers) {
      const t = tip(f);
      const svx = (t.x - f.prev.x) / dt, svy = (t.y - f.prev.y) / dt;
      collideSeg(f.px, f.py, t.x, t.y, R + 7, REST_FLIP, svx, svy);
    }

    // ---- Schalter ----
    // obere Gassen
    if (ball.y > 55 && ball.y < 90) {
      [166, 202, 238].forEach((x, i) => {
        if (Math.abs(ball.x - x) < 12 && frei('top' + i, 0.6)) topLane(i);
      });
    }
    // Rampeneinfahrt: nur mit genug Schwung nach oben
    for (const r of ramps) {
      if (ball.x > r.ein.x0 && ball.x < r.ein.x1 && Math.abs(ball.y - r.ein.y) < 8 && ball.vy < -250) {
        rampe(r); return;
      }
    }
    // Schädel-Loch
    if ((cool.schaedel || 0) < zeit && Math.hypot(ball.x - SKULL.x, ball.y - SKULL.y) < 22) { schaedel(); return; }
    // Umlauf links hinauf
    if (ball.x < 58 && Math.abs(ball.y - 320) < 10 && ball.vy < -150 && frei('orbit', 1.5)) {
      punkte(25000, 2000); melde('FLUCHTWEG 25.000'); sfx.gasse();
    }

    // Tempolimit gegen Durchtunneln
    const sp = Math.hypot(ball.vx, ball.vy), VMAX = 2200;
    if (sp > VMAX) { ball.vx *= VMAX / sp; ball.vy *= VMAX / sp; }

    if (ball.y > H + 20) drain();
  }

  function drain() {
    const b = bonus * MULTI[multi];
    score += b;
    melde(`BONUS ${bonus.toLocaleString('de-DE')} × ${MULTI[multi]}`, 2.2);
    bonus = 0; multi = 0;
    if (ballNo >= 3) gameOver = true; else ballNo++;
    newBall();
    updateHud();
  }

  // Abzug: Kugel abschießen (wie der Pistolengriff im Original)
  function abzug() {
    if (gameOver) { restart(); return; }
    if (!loaded) return;
    loaded = false;
    ball.vy = -(1880 + Math.random() * 80);
    sfx.schuss(1);
  }

  // Für den Update-Mechanismus: automatisch neu laden nur, wenn kein Spiel läuft
  window.spielRuht = () => gameOver || (loaded && score === 0 && ballNo === 1);

  function restart() {
    score = 0; ballNo = 1; gameOver = false; bonus = 0; multi = 0; stufe = 1;
    topLanes.fill(false); drops.forEach(d => { d.unten = false; }); standups.forEach(s => { s.an = false; });
    newBall(); updateHud();
  }

  // ---------- Zeichnen ----------
  const C = {
    feld: '#101c2e', rand: '#6fb6d3', chrom: '#c9d4df', rot: '#e0344a', amber: '#ffb347',
    aus: '#2a3a52', gruen: '#3fd08a', text: '#e8eef5',
  };
  function lampe(x, y, r, an, farbe) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * PI);
    ctx.fillStyle = an ? farbe : C.aus; ctx.fill();
  }
  function schrift(text, x, y, gr, farbe, ausr = 'center') {
    ctx.font = `${gr}px Bungee, "Arial Black", sans-serif`;
    ctx.textAlign = ausr; ctx.fillStyle = farbe; ctx.fillText(text, x, y);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = C.feld; ctx.fillRect(0, 0, W, H);

    // Beschriftung der Gassen (eigene Namen)
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.translate(35, 400); ctx.rotate(-PI / 2); schrift('FLUCHTWEG', 0, 4, 11, C.rand); ctx.restore();
    ctx.save(); ctx.globalAlpha = 0.35;
    ctx.translate(345, 330); ctx.rotate(PI / 2); schrift('SCHLEIFE', 0, 4, 11, C.rand); ctx.restore();

    // Lampen: obere Gassen, Bonus-Multiplikator, Alarmstufe
    [166, 202, 238].forEach((x, i) => lampe(x, 72, 6, topLanes[i], C.gruen));
    MULTI.slice(1).forEach((m, i) => {
      const x = 130 + i * 38, an = multi >= i + 1;
      lampe(x, 600, 13, an, C.amber);
      schrift(m + 'X', x, 604, 10, an ? '#1a1206' : '#6d7f95');
    });
    for (let i = 0; i < 5; i++) lampe(188 + (i - 2) * 16, 440 - 0, 5, stufe > i, C.rot);
    schrift('ALARM', 188, 462, 9, '#6d7f95');

    // Wände
    ctx.lineCap = 'round';
    ctx.strokeStyle = C.rand; ctx.lineWidth = 4;
    ctx.beginPath();
    for (const w of walls) { if (!w.kick) { ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); } }
    ctx.stroke();

    // Schleudern
    for (const s of slings) {
      s.flash = Math.max(0, (s.flash || 0) - 0.08);
      ctx.beginPath(); ctx.moveTo(...s.pts[0]); ctx.lineTo(...s.pts[1]); ctx.lineTo(...s.pts[2]); ctx.closePath();
      ctx.fillStyle = s.flash > 0 ? '#ffd1d6' : '#7a1f2c'; ctx.fill();
      ctx.strokeStyle = C.rot; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(...s.pts[2]); ctx.lineTo(...s.pts[0]); ctx.stroke();
    }

    for (const p of posts) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 2 * PI); ctx.fillStyle = C.chrom; ctx.fill(); }

    // Klappziele + Stehziele
    for (const d of drops) {
      ctx.fillStyle = d.unten ? '#26344a' : C.rot;
      ctx.fillRect(d.x - d.w / 2 + 1, d.y - 5, d.w - 2, 8);
    }
    for (const s of standups) {
      ctx.fillStyle = s.an ? C.amber : '#b5c6d6';
      ctx.fillRect(s.x - 3, s.y - s.h / 2, 6, s.h);
    }

    // Pop-Bumper
    for (const b of bumpers) {
      b.flash = Math.max(0, b.flash - 0.06);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 2 * PI);
      ctx.fillStyle = b.flash > 0 ? '#ffe0e4' : C.rot; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.55, 0, 2 * PI);
      ctx.fillStyle = C.chrom; ctx.fill();
    }

    // Schädel über dem Loch (eigene, schlichte Form)
    const sx = SKULL.x, sy = SKULL.y - 26;
    ctx.fillStyle = C.chrom;
    ctx.beginPath(); ctx.ellipse(sx, sy, 20, 17, 0, 0, 2 * PI); ctx.fill();
    ctx.fillRect(sx - 12, sy + 8, 24, 12);
    const glut = ball.halt > 0 ? 1 : 0.55 + 0.45 * Math.sin(zeit * 4);
    ctx.fillStyle = `rgba(255, 40, 50, ${glut})`;
    ctx.beginPath(); ctx.arc(sx - 7, sy + 1, 4, 0, 2 * PI); ctx.arc(sx + 7, sy + 1, 4, 0, 2 * PI); ctx.fill();
    ctx.strokeStyle = C.feld; ctx.lineWidth = 1.5;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(sx + k * 4.5, sy + 12); ctx.lineTo(sx + k * 4.5, sy + 19); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(SKULL.x, SKULL.y, 10, 0, 2 * PI); ctx.fillStyle = '#05080d'; ctx.fill();

    // Abschussrinne: Kolben
    ctx.fillStyle = '#9fb3c8'; ctx.fillRect(LANE_X + 5, SHOOT_Y + R, 392 - LANE_X - 10, 6);

    // Flipper
    ctx.strokeStyle = C.amber; ctx.lineWidth = 13;
    for (const f of flippers) {
      const t = tip(f);
      ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(t.x, t.y); ctx.stroke();
    }

    // Rampen (halbtransparent über dem Feld)
    for (const r of ramps) {
      ctx.save();
      ctx.globalAlpha = 0.22; ctx.strokeStyle = C.chrom; ctx.lineWidth = 22;
      ctx.beginPath(); ctx.moveTo(...r.pfad[0]); ctx.bezierCurveTo(...r.pfad[1], ...r.pfad[2], ...r.pfad[3]); ctx.stroke();
      ctx.globalAlpha = 0.6; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(...r.pfad[0]); ctx.bezierCurveTo(...r.pfad[1], ...r.pfad[2], ...r.pfad[3]); ctx.stroke();
      ctx.restore();
    }

    // Kugel (auf der Rampe entlang der Bahn)
    let bx = ball.x, by = ball.y;
    if (ball.rampe) [bx, by] = bez(ball.rampe.r.pfad, Math.min(1, ball.rampe.t / RAMP_T));
    const g = ctx.createRadialGradient(bx - 3, by - 3, 1, bx, by, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#8a97a6');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bx, by, R, 0, 2 * PI); ctx.fill();

    // Meldung (wie die Punktmatrix-Anzeige)
    if (meldung && zeit < meldung.bis) {
      ctx.fillStyle = 'rgba(5, 8, 13, .8)'; ctx.fillRect(40, 488, W - 80 - 36, 34);
      schrift(meldung.text, (W - 36) / 2, 511, 15, C.amber);
    }

    // Hinweis auf den Abzug
    if (loaded && !gameOver) {
      const a = 0.5 + 0.5 * Math.sin(performance.now() / 180);
      ctx.globalAlpha = a; schrift('ABZUG!', 188, 540, 16, C.rot); ctx.globalAlpha = 1;
    }

    if (gameOver) {
      ctx.fillStyle = 'rgba(11,20,32,.78)'; ctx.fillRect(0, 0, W, H);
      schrift('GAME OVER', W / 2, H / 2 - 10, 34, C.amber);
      ctx.font = '16px system-ui, sans-serif'; ctx.fillStyle = C.text;
      ctx.fillText('Abzug drücken für ein neues Spiel', W / 2, H / 2 + 24);
    }
  }

  // ---------- Skalierung ----------
  let scale = 1;
  function resize() {
    const st = document.getElementById('stage').getBoundingClientRect();
    scale = Math.min(st.width / W, st.height / H);
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = W * scale + 'px';
    cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Eingabe ----------
  function bindButton(el, f) {
    const on = e => { e.preventDefault(); if (!f.on) sfx.flipper(); f.on = true; el.classList.add('on'); };
    const off = () => { f.on = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  const bl = document.getElementById('bl'), br = document.getElementById('br'), fire = document.getElementById('fire');
  bindButton(bl, flippers[0]);
  bindButton(br, flippers[1]);
  fire.addEventListener('pointerdown', e => { e.preventDefault(); fire.classList.add('on'); abzug(); });
  fire.addEventListener('pointerup', () => fire.classList.remove('on'));
  fire.addEventListener('pointercancel', () => fire.classList.remove('on'));
  fire.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', () => { if (gameOver) restart(); });

  // Tastatur (Desktop): ← / → oder Z / M für die Flipper, Leertaste = Abzug
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.key === 'ArrowLeft' || e.key === 'z') { sfx.flipper(); flippers[0].on = true; bl.classList.add('on'); }
    if (e.key === 'ArrowRight' || e.key === 'm') { sfx.flipper(); flippers[1].on = true; br.classList.add('on'); }
    if (e.key === ' ') { e.preventDefault(); abzug(); }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'z') { flippers[0].on = false; bl.classList.remove('on'); }
    if (e.key === 'ArrowRight' || e.key === 'm') { flippers[1].on = false; br.classList.remove('on'); }
  });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    fire.classList.toggle('bereit', loaded && !gameOver);
    const pause = !document.getElementById('start').hidden;
    if (!gameOver && !pause) for (let i = 0; i < STEPS; i++) step(dt / STEPS);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Nur für automatische Tests (Node), im Browser ohne Wirkung
  if (window.__TEST__) window.__TEST__.api = { step, abzug, get ball() { return ball; }, get score() { return score; },
    get loaded() { return loaded; }, flippers, get stufe() { return stufe; } };
})();
</script>
<script>
// ---------- Update-Mechanismus (Home-Bildschirm-App) ----------
(() => {
  const updateEl = document.getElementById('update');
  const verEl = document.getElementById('ver');
  verEl.textContent = 'v' + APP_VERSION;

  let ausTimer = null, infoTimer = null;
  function einblenden() {
    clearTimeout(ausTimer);
    updateEl.hidden = false; void updateEl.offsetWidth;
    updateEl.classList.add('an');
  }
  function ausblenden() {
    updateEl.classList.remove('an'); clearTimeout(ausTimer);
    ausTimer = setTimeout(() => { if (!updateEl.classList.contains('an')) updateEl.hidden = true; }, 380);
  }
  window.showInfo = showInfo;
  function showInfo(text, sekunden = 2) {
    updateEl.className = 'update info';
    document.getElementById('update-text').textContent = text;
    document.getElementById('update-go').hidden = true;
    einblenden();
    clearTimeout(infoTimer);
    if (sekunden) infoTimer = setTimeout(() => {
      if (updateEl.classList.contains('info')) ausblenden();
    }, sekunden * 1000);
  }
  function zeigeBanner(text) {
    updateEl.className = 'update';
    document.getElementById('update-text').textContent = text;
    document.getElementById('update-go').hidden = false;
    einblenden();
  }
  updateEl.addEventListener('click', () => { if (updateEl.classList.contains('info')) ausblenden(); });
  document.getElementById('update-go').addEventListener('click', () => location.reload());

  // Service Worker: nur wo erlaubt (GitHub Pages ja, Claude-Vorschau nein)
  let swOk = false;
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').then(() => { swOk = true; }).catch(() => {});
  }

  let checking = false, announced = null;
  async function checkForUpdate(manual = false) {
    if (checking) return;
    if (!manual && document.visibilityState !== 'visible') return;
    if (!navigator.onLine) { if (manual) showInfo('Offline – Prüfung nicht möglich'); return; }
    checking = true;
    try {
      const res = await fetch('index.html', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const m = (await res.text()).match(/APP_VERSION = '([^']+)'/);
      if (m && m[1] !== APP_VERSION) announceUpdate(m[1], manual);
      else if (m && manual) showInfo('Version ' + APP_VERSION + ' ist aktuell', 4);
      else if (manual) showInfo('Update-Prüfung nur in der App vom Home-Bildschirm', 4);
    } catch (_) {
      if (manual) showInfo(swOk ? 'Prüfung fehlgeschlagen' : 'Update-Prüfung nur in der App vom Home-Bildschirm', 4);
    } finally { checking = false; }
  }

  // Mitten im Spiel nicht neu laden: dann nur Banner mit Knopf
  function announceUpdate(v, manual) {
    if (announced === v && !manual) return;
    announced = v;
    zeigeBanner('Neue Version ' + v + ' ist da');
    const ruhig = window.spielRuht ? window.spielRuht() : true;
    if (manual || ruhig) setTimeout(() => location.reload(), manual ? 1500 : 3000);
  }

  window.addEventListener('pageshow', () => setTimeout(checkForUpdate, 800));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
  });
  verEl.addEventListener('click', () => checkForUpdate(true));

  // Nach dem Update einmal melden, was jetzt läuft
  const GESEHEN = 'flipper.gesehen';
  let vorher = null;
  try { vorher = localStorage.getItem(GESEHEN); } catch (_) {}
  if (vorher !== APP_VERSION) {
    try { localStorage.setItem(GESEHEN, APP_VERSION); } catch (_) {}
    if (vorher) setTimeout(() => showInfo('Version ' + APP_VERSION + ' ist geladen', 4), 400);
  }
})();
</script>
