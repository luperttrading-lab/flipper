<title>Flipper Prototyp</title>
<meta name="theme-color" content="#0b1420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1420;
    --table: #12233a;
    --rail: #5fb8d6;
    --flip: #ffb347;
    --bump: #e2557f;
    --ink: #e8eef5;
    --muted: #7d93ab;
    --btn: #1b3050;
    --btn-on: #ffb347;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    padding-inline: 16px;
    box-sizing: border-box;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-block: 8px 6px;
    font-variant-numeric: tabular-nums;
  }
  .score { font-family: "Bungee", "Arial Black", sans-serif; font-size: 22px; color: var(--flip); }
  .balls { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
  canvas { touch-action: none; display: block; border-radius: 14px; }
  .controls {
    display: flex;
    gap: 16px;
    padding-block: 10px 12px;
  }
  .controls button {
    flex: 1;
    height: 84px;
    border: 0;
    border-radius: 42px;
    background: var(--btn);
    color: var(--ink);
    font: 600 15px system-ui, sans-serif;
    letter-spacing: .06em;
    text-transform: uppercase;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .controls button.on { background: var(--btn-on); color: #1a1206; }
  .controls button:focus-visible { outline: 3px solid var(--rail); outline-offset: 2px; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 4px; }
</style>

<header>
  <span class="score" id="score">0</span>
  <span class="balls" id="balls">Kugel 1 / 3</span>
</header>
<div id="stage"><canvas id="c" aria-label="Flippertisch"></canvas></div>
<div class="hint" id="hint">Rechts nach unten wischen = Feder spannen · loslassen = Schuss</div>
<div class="controls">
  <button id="bl" type="button">Links</button>
  <button id="br" type="button">Rechts</button>
</div>

<script>
(() => {
  // Logische Tischgröße (px), wird auf den Bildschirm skaliert
  const W = 400, H = 700;
  const R = 10;                 // Kugelradius
  const G = 1100;               // Schwerkraft (px/s²), entspricht Tischneigung
  const STEPS = 10;             // Physik-Substeps pro Frame
  const LANE_X = 345;           // Trennwand Abschussrinne
  const PLUNGER_Y = 650;        // Oberkante Feder in Ruhe
  const PULL_MAX = 45;          // Federweg in px
  const REST_WALL = 0.55, REST_FLIP = 0.35;

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const ballsEl = document.getElementById('balls');
  const hintEl = document.getElementById('hint');

  // ---------- Geometrie ----------
  const walls = [];
  const seg = (x1, y1, x2, y2) => walls.push({ x1, y1, x2, y2 });
  // Außenwände
  seg(20, 200, 20, 520);
  seg(380, 200, 380, 700);
  // Bogen oben (Halbkreis Mittelpunkt 200/200, r=180)
  const N = 24;
  for (let i = 0; i < N; i++) {
    const a1 = Math.PI + (i / N) * Math.PI, a2 = Math.PI + ((i + 1) / N) * Math.PI;
    seg(200 + 180 * Math.cos(a1), 200 + 180 * Math.sin(a1), 200 + 180 * Math.cos(a2), 200 + 180 * Math.sin(a2));
  }
  // Trennwand Abschussrinne
  seg(LANE_X, 240, LANE_X, 700);
  // Schrägen zu den Flippern
  seg(20, 520, 100, 585);
  seg(LANE_X, 520, 265, 585);

  const bumpers = [
    { x: 115, y: 290, r: 24, flash: 0 },
    { x: 250, y: 290, r: 24, flash: 0 },
    { x: 182, y: 385, r: 24, flash: 0 },
  ];

  const FL = 66;                         // Flipperlänge
  const flippers = [
    { px: 100, py: 588, side: 1, a: 0.5, prev: null, on: false },
    { px: 265, py: 588, side: -1, a: 0.5, prev: null, on: false },
  ];
  const A_REST = 0.5, A_UP = -0.45, A_SPEED = 22; // rad, rad/s
  const tip = f => ({ x: f.px + f.side * FL * Math.cos(f.a), y: f.py + FL * Math.sin(f.a) });

  // ---------- Zustand ----------
  let ball, score = 0, ballNo = 1, pull = 0, dragging = null, gameOver = false;
  function newBall() { ball = { x: 362, y: PLUNGER_Y - R, vx: 0, vy: 0 }; }
  newBall();
  const inLane = () => ball.x > LANE_X && ball.y > 240;

  function updateHud() {
    scoreEl.textContent = score.toLocaleString('de-DE');
    ballsEl.textContent = gameOver ? 'Game over' : `Kugel ${ballNo} / 3`;
    hintEl.textContent = gameOver ? 'Tippen zum Neustart'
      : 'Rechts nach unten wischen = Feder spannen · loslassen = Schuss';
  }
  updateHud();

  // ---------- Kollision ----------
  function collideSeg(x1, y1, x2, y2, rad, rest, svx = 0, svy = 0) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = ((ball.x - x1) * dx + (ball.y - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    let nx = ball.x - cx, ny = ball.y - cy;
    const d = Math.hypot(nx, ny);
    if (d >= rad || d === 0) return false;
    nx /= d; ny /= d;
    ball.x = cx + nx * rad; ball.y = cy + ny * rad;
    // Relativgeschwindigkeit zur (evtl. bewegten) Oberfläche
    const sx = svx * t, sy = svy * t;
    const rvx = ball.vx - sx, rvy = ball.vy - sy;
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      ball.vx -= (1 + rest) * vn * nx;
      ball.vy -= (1 + rest) * vn * ny;
    }
    return true;
  }

  function step(dt) {
    // Flipper bewegen
    for (const f of flippers) {
      const target = f.on ? A_UP : A_REST;
      f.prev = tip(f);
      const da = target - f.a, maxd = A_SPEED * dt;
      f.a += Math.max(-maxd, Math.min(maxd, da));
    }

    ball.vy += G * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    for (const w of walls) collideSeg(w.x1, w.y1, w.x2, w.y2, R, REST_WALL);

    // Feder-Oberkante als Boden der Rinne
    const py = PLUNGER_Y + pull * PULL_MAX;
    if (ball.x > LANE_X) collideSeg(LANE_X, py, 380, py, R, 0.1);

    for (const b of bumpers) {
      const dx = ball.x - b.x, dy = ball.y - b.y, d = Math.hypot(dx, dy), min = b.r + R;
      if (d < min && d > 0) {
        const nx = dx / d, ny = dy / d;
        ball.x = b.x + nx * min; ball.y = b.y + ny * min;
        const vn = ball.vx * nx + ball.vy * ny;
        if (vn < 0) { ball.vx -= 2 * vn * nx; ball.vy -= 2 * vn * ny; }
        // aktiver Kick
        ball.vx += nx * 260; ball.vy += ny * 260;
        if (b.flash <= 0.05) { score += 100; updateHud(); }
        b.flash = 1;
      }
    }

    for (const f of flippers) {
      const t = tip(f);
      const svx = (t.x - f.prev.x) / dt, svy = (t.y - f.prev.y) / dt;
      collideSeg(f.px, f.py, t.x, t.y, R + 7, REST_FLIP, svx, svy);
    }

    // Tempolimit gegen Durchtunneln
    const sp = Math.hypot(ball.vx, ball.vy), VMAX = 2200;
    if (sp > VMAX) { ball.vx *= VMAX / sp; ball.vy *= VMAX / sp; }

    if (ball.y > H + 30) drain();
  }

  function drain() {
    if (ballNo >= 3) { gameOver = true; }
    else { ballNo++; }
    newBall();
    updateHud();
  }

  function restart() { score = 0; ballNo = 1; gameOver = false; newBall(); updateHud(); }

  // ---------- Zeichnen ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#12233a';
    ctx.fillRect(0, 0, W, H);

    ctx.lineCap = 'round';
    ctx.strokeStyle = '#5fb8d6';
    ctx.lineWidth = 4;
    ctx.beginPath();
    for (const w of walls) { ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); }
    ctx.stroke();

    for (const b of bumpers) {
      b.flash = Math.max(0, b.flash - 0.06);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.flash > 0 ? '#ffd1de' : '#e2557f';
      ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = '#12233a'; ctx.fill();
    }

    // Feder
    const py = PLUNGER_Y + pull * PULL_MAX;
    ctx.fillStyle = '#9fb3c8';
    ctx.fillRect(LANE_X + 6, py, 380 - LANE_X - 12, 6);
    ctx.strokeStyle = '#7d93ab'; ctx.lineWidth = 2;
    ctx.beginPath();
    const coils = 6, top = py + 6, bottom = 695, cxm = (LANE_X + 380) / 2;
    for (let i = 0; i <= coils * 2; i++) {
      const y = top + (bottom - top) * i / (coils * 2);
      const x = cxm + (i % 2 ? 9 : -9);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();

    // Flipper
    ctx.strokeStyle = '#ffb347';
    ctx.lineWidth = 14;
    for (const f of flippers) {
      const t = tip(f);
      ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(t.x, t.y); ctx.stroke();
    }

    // Kugel
    const g = ctx.createRadialGradient(ball.x - 3, ball.y - 4, 1, ball.x, ball.y, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#8a97a6');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2); ctx.fill();

    if (gameOver) {
      ctx.fillStyle = 'rgba(11,20,32,.75)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffb347'; ctx.textAlign = 'center';
      ctx.font = '34px Bungee, "Arial Black", sans-serif';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 10);
      ctx.font = '16px system-ui, sans-serif'; ctx.fillStyle = '#e8eef5';
      ctx.fillText('Tippen zum Neustart', W / 2, H / 2 + 24);
    }
  }

  // ---------- Skalierung ----------
  let scale = 1;
  function resize() {
    const st = document.getElementById('stage').getBoundingClientRect();
    scale = Math.min(st.width / W, st.height / H);
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = W * scale + 'px';
    cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Eingabe: Feder ----------
  function releasePlunger() {
    const onPlunger = inLane() && ball.y + R >= PLUNGER_Y + pull * PULL_MAX - 3;
    if (onPlunger && pull > 0.05) ball.vy = -(500 + pull * 1300);
    pull = 0;
  }
  cv.addEventListener('pointerdown', e => {
    if (gameOver) { restart(); return; }
    const r = cv.getBoundingClientRect();
    if ((e.clientX - r.left) / scale > W / 2) {
      dragging = { id: e.pointerId, y0: e.clientY };
      cv.setPointerCapture(e.pointerId);
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== dragging.id) return;
    pull = Math.max(0, Math.min(1, (e.clientY - dragging.y0) / (140)));
  });
  const endDrag = e => {
    if (!dragging || e.pointerId !== dragging.id) return;
    dragging = null;
    releasePlunger();
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  // ---------- Eingabe: Flipper ----------
  function bindButton(el, f) {
    const on = e => { e.preventDefault(); f.on = true; el.classList.add('on'); };
    const off = () => { f.on = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  const bl = document.getElementById('bl'), br = document.getElementById('br');
  bindButton(bl, flippers[0]);
  bindButton(br, flippers[1]);

  // Tastatur (Desktop): ← / → oder Z / M, Leertaste = Feder halten
  let spaceHeld = false;
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.key === 'ArrowLeft' || e.key === 'z') { flippers[0].on = true; bl.classList.add('on'); }
    if (e.key === 'ArrowRight' || e.key === 'm') { flippers[1].on = true; br.classList.add('on'); }
    if (e.key === ' ') { e.preventDefault(); if (gameOver) restart(); else spaceHeld = true; }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'z') { flippers[0].on = false; bl.classList.remove('on'); }
    if (e.key === 'ArrowRight' || e.key === 'm') { flippers[1].on = false; br.classList.remove('on'); }
    if (e.key === ' ' && spaceHeld) { spaceHeld = false; releasePlunger(); }
  });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (spaceHeld) pull = Math.min(1, pull + dt * 1.5);
    if (!gameOver) for (let i = 0; i < STEPS; i++) step(dt / STEPS);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
