<style>
  :root {
    color-scheme: dark;
    --bg: #0b1420;
    --table: #12233a;
    --rail: #5fb8d6;
    --flip: #ffb347;
    --bump: #e2557f;
    --ink: #e8eef5;
    --muted: #7d93ab;
    --btn: #1b3050;
    --btn-on: #ffb347;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    margin: 0;
    padding-inline: 4px;
    box-sizing: border-box;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  header {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    padding-block: calc(env(safe-area-inset-top, 0px) + 6px) 4px;
    font-variant-numeric: tabular-nums;
  }
  #dmd {
    width: min(100%, 320px); display: block; border-radius: 6px;
    background: #090402; box-shadow: 0 0 0 2px #1c1510, 0 0 18px rgba(255, 70, 30, .14);
  }
  #stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-end; perspective: 1300px; }
  #c {
    touch-action: none; display: block; border-radius: 10px;
    transform: rotateX(10deg); transform-origin: 50% 100%;
    box-shadow: 0 0 0 3px #2a3140, 0 0 0 6px #0c0f15;
  }
  html, body { touch-action: none; }      /* ganzer Schirm ist Steuerfläche: kein Zoomen/Scrollen */
  /* Kein Knopf mehr: Abzug = Tipp auf die Abschussrinne (rechts unten im Tisch); der Tisch reicht bis ganz unten,
     unten bleibt nur der Streifen der Home-Leiste frei (sonst schneiden die runden Bildschirmecken die Kugel ab) */
  #stage { padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  .ver {
    font-size: 13px; color: var(--muted); background: none; border: 0; padding: 8px 4px;
    text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer;
  }
  /* Update-Banner: überlagert (fixed), schiebt nichts */
  .update {
    position: fixed; left: 12px; right: 12px; top: max(env(safe-area-inset-top), 12px); z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #34c759; color: #06240e;
    padding: 12px 14px; border-radius: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    opacity: 0; transition: opacity .35s ease; pointer-events: none;
  }
  /* Start-Schirm: ein Tipp darauf schaltet auf iOS den Ton frei */
  .start {
    position: fixed; inset: 0; z-index: 25;
    display: flex; align-items: center; justify-content: center;
    background: rgba(11, 20, 32, .72);
  }
  .start[hidden] { display: none; }
  /* Beim ersten Start: Startbild über den ganzen Schirm („cover“). Texte sitzen in Prozent der BILDFLÄCHE,
     damit sie auf jedem Gerät an derselben Stelle im Bild liegen (Bild 768 × 1376). */
  .start.splash { background: #0b131d; overflow: hidden; }
  .splash-bild { display: none; }
  .start.splash .splash-bild {
    display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: max(100vw, calc(100vh * 768 / 1376)); aspect-ratio: 768 / 1376;
    background: url(start.jpg) center / 100% 100% no-repeat;
  }
  .start.splash > #start-text, .start.splash > .start-leiste { display: none; }
  /* „Antippen zum Starten“ an der Stelle des (übermalten) Ladetextes, im Wechsel mit der Kurzanleitung – rote Leuchtschrift */
  .splash-text {
    position: absolute; left: 0; right: 0; top: 94.3%; transform: translateY(-50%);
    height: 1.6em; text-align: center; font-family: "Bungee", "Arial Black", sans-serif;
    font-size: clamp(13px, 3.9vw, 19px); letter-spacing: .08em; color: #ff5a46;
    text-shadow: 0 0 4px rgba(255, 70, 50, .9), 0 0 14px rgba(255, 40, 20, .55);
  }
  .splash-text span { position: absolute; left: 0; right: 0; animation: wechsel 6s infinite; }
  .splash-text span + span { animation-delay: -3s; font-size: .62em; line-height: 2.6; letter-spacing: .04em; }
  @keyframes wechsel { 0%, 42% { opacity: 1; } 50%, 92% { opacity: 0; } 100% { opacity: 1; } }
  /* Versionsnummer dezent unter dem Anzeige-Rahmen des Bildes, rechtsbündig, gleiche Leuchtschrift */
  .splash-ver {
    position: absolute; top: 20.6%; right: 11.5%; background: none; border: 0; padding: 6px 2px;
    font-family: "Bungee", "Arial Black", sans-serif; font-size: 10px; letter-spacing: .18em;
    color: rgba(255, 96, 76, .55); text-shadow: 0 0 6px rgba(255, 50, 30, .45);
  }
  @media (prefers-reduced-motion: reduce) { .splash-text span { animation: none; } .splash-text span + span { display: none; } }
  .start-leiste {
    position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    display: flex; justify-content: center; gap: 22px;
  }
  .start-leiste .ver { color: rgba(232, 238, 245, .7); }
  .start > span {
    font-family: "Bungee", "Arial Black", sans-serif; font-size: 22px; color: var(--flip);
    padding: 18px 26px; border: 2px solid var(--flip); border-radius: 16px;
  }
  .update.an { opacity: 1; pointer-events: auto; }
  .update[hidden] { display: none; }
  .update.info { background: #2d2d33; color: #f2f2f7; font-weight: 500; }
  .update .btn { border: 0; border-radius: 10px; padding: 8px 14px; font: 600 15px system-ui, sans-serif; background: #06240e; color: #fff; }
  @media (prefers-reduced-motion: reduce) { .update { transition: none; } }

<script>
// ---------- Ton (Web Audio, synthetisch, keine Dateien) ----------
const sfx = (() => {
  let ac = null, master = null, an = true, musikTimer = null;
  try { an = localStorage.getItem('flipper.ton') !== 'aus'; } catch (_) {}
  const tonEl = document.getElementById('ton');
  const zeige = () => { tonEl.textContent = an ? 'Ton an' : 'Ton aus'; };
  zeige();

  // iOS erlaubt Ton erst nach einer Berührung: Kontext beim ersten Antippen starten
  function neu() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { if (ac) ac.close(); } catch (_) {}
    ac = new AC(); master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
  }
  function unlock() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
    try {
      if (!ac || ac.state === 'closed') neu();
      if (!ac) return;
      if (ac.state !== 'running') {
        const p = ac.resume();
        if (p && p.catch) p.catch(() => {});
        // stiller Mini-Ton: schaltet die Ausgabe auf iOS zuverlässig frei
        const b = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource();
        src.buffer = b; src.connect(ac.destination); src.start(0);
      }
    } catch (_) { ac = null; }
  }
  // iOS zählt nur Loslassen/Klick/Taste als Nutzeraktion – nur dort freischalten
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(ev =>
    window.addEventListener(ev, unlock, { capture: true, passive: true }));

  // Stilles HTML-Audio in Schleife: stellt iOS auf „Medienwiedergabe“ um,
  // damit Web Audio auch bei Stummschalter und nach Unterbrechungen hörbar bleibt
  function stilleWav() {
    const rate = 8000, n = rate / 2, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
    const str = (o, t) => { for (let i = 0; i < t.length; i++) b[o + i] = t.charCodeAt(i); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    str(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
    let bin = ''; for (const x of b) bin += String.fromCharCode(x);
    return 'data:audio/wav;base64,' + btoa(bin);
  }
  const medien = new Audio(stilleWav());
  medien.loop = true; medien.setAttribute('playsinline', '');
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { try { medien.pause(); } catch (_) {} }
  });

  // Start-/Pause-Schirm: beim Öffnen und nach jedem Zurückholen aus dem Hintergrund.
  // Der Tipp darauf baut den Tonkanal frisch auf (iOS meldet nach Unterbrechungen oft
  // 'running', spielt aber nichts mehr).
  const startEl = document.getElementById('start');
  let frisch = true;
  startEl.addEventListener('click', () => {
    if (an) {
      try { const p = medien.play(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
      if (frisch) { neu(); frisch = false; }
      unlock();
      setTimeout(() => api.bumper(2), 80);
    }
    startEl.hidden = true;
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      frisch = true;
      document.getElementById('start-text').textContent = 'Pause – antippen';
      startEl.classList.remove('splash');
      startEl.hidden = false;
    }
  });

  // Umschalten mit Rückmeldung: Probeton + Zustand im Banner (hilft auch bei der Fehlersuche)
  tonEl.addEventListener('click', e => {
    e.stopPropagation();
    an = !an; zeige();
    try { localStorage.setItem('flipper.ton', an ? 'an' : 'aus'); } catch (_) {}
    if (!an) { window.showInfo && window.showInfo('Ton aus', 2); return; }
    setTimeout(() => {
      const st = ac ? ac.state : 'nicht verfügbar';
      try { const p = medien.play(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
      if (st === 'running') { api.bumper(0); window.showInfo && window.showInfo('Ton an · Kanal ' + st, 2); }
      else window.showInfo && window.showInfo('Ton blockiert (' + st + ') – einmal auf den Tisch tippen', 4);
    }, 150);
  });

  function spiele(fn) {
    if (!an || !ac) return;
    if (ac.state === 'running') { fn(); return; }
    const p = ac.resume();
    if (p && p.then) p.then(() => { if (ac.state === 'running') fn(); }).catch(() => {});
  }

  function ton(typ, f0, f1, dauer, laut, start = 0) {
    const t = ac.currentTime + start;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = typ;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dauer);
    g.gain.setValueAtTime(laut, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dauer);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dauer + 0.02);
  }
  function rauschen(dauer, laut, filterF0, filterF1, q = 1) {
    const t = ac.currentTime, n = Math.floor(ac.sampleRate * dauer);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.Q.value = q;
    bp.frequency.setValueAtTime(filterF0, t);
    bp.frequency.exponentialRampToValueAtTime(filterF1, t + dauer);
    g.gain.setValueAtTime(laut, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dauer);
    src.connect(bp).connect(g).connect(master);
    src.start(t);
  }

  // Drei Bumper = C-Dur-Dreiklang, jeder mit eigener Klangfarbe
  const BUMPER = [
    { typ: 'square',   f: 523.25 },   // C5
    { typ: 'triangle', f: 659.25 },   // E5
    { typ: 'sawtooth', f: 783.99 },   // G5
  ];

  const api = {
    // Flipper: kurzes mechanisches Klacken, tief und trocken
    flipper() { spiele(() => {
      rauschen(0.05, 0.5, 2500, 800, 2);
      ton('sine', 140, 60, 0.08, 0.6);
    }); },
    // Abschuss: aufsteigendes Zischen, lauter und höher je stärker gespannt
    schuss(staerke) { spiele(() => {
      rauschen(0.35, 0.25 + 0.35 * staerke, 400, 3000 + 3000 * staerke, 0.8);
      ton('sine', 180, 420 + 400 * staerke, 0.3, 0.3);
    }); },
    // Klappziel/Stehziel: heller, kurzer Doppel-Pieps
    ziel() { spiele(() => {
      ton('square', 1046, 1046, 0.05, 0.12);
      ton('square', 1318, 1318, 0.06, 0.1, 0.05);
    }); },
    // Obere Gasse / Umlauf: kurzes Aufwärts-Glissando
    gasse() { spiele(() => { ton('triangle', 600, 1200, 0.12, 0.18); }); },
    // Schleuder: trockener, harter Schlag
    schleuder() { spiele(() => {
      rauschen(0.04, 0.45, 3500, 1500, 3);
      ton('square', 220, 110, 0.05, 0.18);
    }); },
    // Rampe: aufsteigende Tonfolge wie ein Alarm
    rampe() { spiele(() => {
      [392, 523, 659, 784].forEach((f, i) => ton('sawtooth', f, f, 0.09, 0.13, i * 0.08));
    }); },
    // Schädel-Loch: tiefes Brummen
    loch() { spiele(() => {
      ton('sawtooth', 110, 55, 0.6, 0.25);
      ton('sine', 220, 110, 0.4, 0.2);
    }); },
    // Auswurf aus dem Loch: dumpfer Stoß
    auswurf() { spiele(() => {
      rauschen(0.08, 0.5, 800, 300, 1.5);
      ton('sine', 90, 50, 0.12, 0.4);
    }); },
    // Kanone: tiefer Knall mit Nachhall
    kanone() { spiele(() => {
      rauschen(0.25, 0.7, 1200, 120, 0.7);
      ton('sine', 120, 35, 0.35, 0.6);
    }); },
    // Multiball/Jackpot: kurze Fanfare
    multiball() { spiele(() => {
      [523, 659, 784, 1046].forEach((f, i) => ton('square', f, f, 0.14, 0.12, i * 0.1));
      ton('sawtooth', 1046, 1046, 0.4, 0.1, 0.4);
    }); },
    // Pop-Bumper: kurzer mechanischer Schlag (Spule), wie am echten Automaten – kein Musikton
    bumper(i) { spiele(() => {
      const v = [1, 1.12, 0.9][i % 3];
      rauschen(0.035, 0.7, 5000 * v, 1800 * v, 0.9);
      ton('sine', 170 * v, 70, 0.07, 0.5);
      ton('square', 95 * v, 60, 0.04, 0.12);
    }); },
    // Ansteigende Sirene vor dem Jackpot (~2,5 s)
    sirene() { spiele(() => {
      const t = ac.currentTime, d = 2.5, lp = ac.createBiquadFilter(), g = ac.createGain();
      lp.type = 'lowpass'; lp.frequency.value = 3000;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.3);
      g.gain.setValueAtTime(0.07, t + d - 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      lp.connect(g).connect(master);
      for (const [typ, m] of [['sawtooth', 1], ['square', 1.5]]) {
        const o = ac.createOscillator(); o.type = typ;
        o.frequency.setValueAtTime(500 * m, t); o.frequency.exponentialRampToValueAtTime(1200 * m, t + d);
        o.connect(lp); o.start(t); o.stop(t + d + 0.05);
      }
    }); },
    // Multiball-Musik: eigene Bass-Schleife (a-Moll, 132 BPM), Bass + Kick + Snare, alles tief
    musik(ein) {
      if (!ein || !an) { if (musikTimer) { clearInterval(musikTimer); musikTimer = null; } return; }
      if (musikTimer || !ac) return;
      const achtel = 60 / 132 / 2;
      let naechste = ac.currentTime + 0.05, schritt = 0;
      // 4 Takte à 8 Achtel: Grundtöne A – A – F – G, Muster Grund/Grund/Oktave/Grund/Grund/Quinte/Grund/Oktave
      const GRUND = [55, 55, 43.65, 49], MUSTER = [1, 1, 2, 1, 1, 1.5, 1, 2];
      musikTimer = setInterval(() => {
        if (!ac || ac.state !== 'running' || !an) return;
        while (naechste < ac.currentTime + 0.12) {
          const takt = Math.floor(schritt / 8) % 4, k = schritt % 8, f = GRUND[takt] * MUSTER[k], t = naechste;
          const o = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
          o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t);
          lp.type = 'lowpass'; lp.frequency.setValueAtTime(700, t); lp.frequency.exponentialRampToValueAtTime(180, t + achtel);
          g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + achtel * 0.95);
          o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t + achtel);
          if (k % 2 === 0) {                                          // Kick auf jede Viertel
            const kk = ac.createOscillator(), kg = ac.createGain();
            kk.frequency.setValueAtTime(120, t); kk.frequency.exponentialRampToValueAtTime(40, t + 0.12);
            kg.gain.setValueAtTime(0.35, t); kg.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
            kk.connect(kg).connect(master); kk.start(t); kk.stop(t + 0.15);
          }
          if (k === 2 || k === 6) {                                   // Snare auf 2 und 4 (Rauschen)
            const n = Math.floor(ac.sampleRate * 0.12), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
            for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
            const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), sg = ac.createGain();
            src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.8; sg.gain.value = 0.12;
            src.connect(bp).connect(sg).connect(master); src.start(t);
          }
          naechste += achtel; schritt++;
        }
      }, 25);
    },
  };
  return api;
})();
</script>
<script>
// ================= Punktmatrix-Anzeige (128 × 32 Punkte, orange wie 1991) =================
const dmd = (() => {
  const DW = 128, DH = 32;
  const buf = new Uint8Array(DW * DH);
  let alt = '';
  const cv = document.getElementById('dmd');
  const cx = cv.getContext('2d');

  // 5×7-Schrift, jede Zeile als Bitmuster (5 Bit breit); schmale Zeichen mit eigener Breite
  const F = {};
  const def = (ch, rows, w = 5) => { F[ch] = { rows, w }; };
  const G5 = {
    '0': [14, 17, 19, 21, 25, 17, 14], '1': [4, 12, 4, 4, 4, 4, 14], '2': [14, 17, 1, 2, 4, 8, 31],
    '3': [31, 2, 4, 2, 1, 17, 14], '4': [2, 6, 10, 18, 31, 2, 2], '5': [31, 16, 30, 1, 1, 17, 14],
    '6': [6, 8, 16, 30, 17, 17, 14], '7': [31, 1, 2, 4, 8, 8, 8], '8': [14, 17, 17, 14, 17, 17, 14],
    '9': [14, 17, 17, 15, 1, 2, 12],
    A: [14, 17, 17, 31, 17, 17, 17], B: [30, 17, 17, 30, 17, 17, 30], C: [14, 17, 16, 16, 16, 17, 14],
    D: [28, 18, 17, 17, 17, 18, 28], E: [31, 16, 16, 30, 16, 16, 31], F: [31, 16, 16, 30, 16, 16, 16],
    G: [14, 17, 16, 23, 17, 17, 15], H: [17, 17, 17, 31, 17, 17, 17], I: [14, 4, 4, 4, 4, 4, 14],
    J: [7, 2, 2, 2, 2, 18, 12], K: [17, 18, 20, 24, 20, 18, 17], L: [16, 16, 16, 16, 16, 16, 31],
    M: [17, 27, 21, 21, 17, 17, 17], N: [17, 17, 25, 21, 19, 17, 17], O: [14, 17, 17, 17, 17, 17, 14],
    P: [30, 17, 17, 30, 16, 16, 16], Q: [14, 17, 17, 17, 21, 18, 13], R: [30, 17, 17, 30, 20, 18, 17],
    S: [15, 16, 16, 14, 1, 1, 30], T: [31, 4, 4, 4, 4, 4, 4], U: [17, 17, 17, 17, 17, 17, 14],
    V: [17, 17, 17, 17, 17, 10, 4], W: [17, 17, 17, 21, 21, 21, 10], X: [17, 17, 10, 4, 10, 17, 17],
    Y: [17, 17, 17, 10, 4, 4, 4], Z: [31, 1, 2, 4, 8, 16, 31],
    'Ä': [10, 0, 14, 17, 31, 17, 17], 'Ö': [10, 0, 14, 17, 17, 17, 14], 'Ü': [10, 0, 17, 17, 17, 17, 14],
    '-': [0, 0, 0, 31, 0, 0, 0], '×': [0, 17, 10, 4, 10, 17, 0], '/': [1, 1, 2, 4, 8, 16, 16],
    '?': [14, 17, 1, 2, 4, 0, 4], '+': [0, 4, 4, 31, 4, 4, 0], '>': [8, 4, 2, 1, 2, 4, 8],
  };
  for (const k in G5) def(k, G5[k]);
  def(' ', [0, 0, 0, 0, 0, 0, 0], 3);
  def('.', [0, 0, 0, 0, 0, 3, 3], 2);
  def(',', [0, 0, 0, 0, 3, 1, 2], 2);
  def('!', [1, 1, 1, 1, 1, 0, 1], 1);
  def(':', [0, 3, 3, 0, 3, 3, 0], 2);

  const glyph = ch => F[ch] || F['?'];
  function breite(t, s = 1) { let w = 0; for (const ch of t) w += (glyph(ch).w + 1) * s; return Math.max(0, w - s); }
  function punkt(x, y, v) { if (x >= 0 && x < DW && y >= 0 && y < DH) buf[y * DW + x] = Math.max(buf[y * DW + x], v); }
  function text(t, x, y, s = 1, v = 3) {
    for (const ch of t) {
      const g = glyph(ch);
      for (let r = 0; r < 7; r++) for (let c = 0; c < g.w; c++) {
        if ((g.rows[r] >> (g.w - 1 - c)) & 1)
          for (let dy = 0; dy < s; dy++) for (let dx = 0; dx < s; dx++) punkt(x + c * s + dx, y + r * s + dy, v);
      }
      x += (g.w + 1) * s;
    }
  }
  function mitte(t, y, s = 1, v = 3) { text(t, Math.floor((DW - breite(t, s)) / 2), y, s, v); }
  function rechts(t, y, s = 1, v = 3) { text(t, DW - 1 - breite(t, s), y, s, v); }
  function leer() { buf.fill(0); }
  function rahmen(v = 1) { for (let x = 0; x < DW; x++) { punkt(x, 0, v); punkt(x, DH - 1, v); } for (let y = 0; y < DH; y++) { punkt(0, y, v); punkt(DW - 1, y, v); } }

  function groesse() {
    const w = cv.clientWidth, dpr = window.devicePixelRatio || 1;
    cv.style.height = Math.round(w / 4) + 'px';
    cv.width = Math.round(w * dpr); cv.height = Math.round(w / 4 * dpr);
    alt = '';
  }
  window.addEventListener('resize', groesse);
  groesse();

  const FARBE = ['#2a0a04', '#7a1e08', '#d23a14', '#ff5a26'];
  function zeichne() {
    const key = buf.join('');
    if (key === alt) return;
    alt = key;
    const p = cv.width / DW, d = p * 0.8, o = (p - d) / 2;
    cx.fillStyle = '#090402'; cx.fillRect(0, 0, cv.width, cv.height);
    for (let v = 0; v < 4; v++) {
      cx.fillStyle = FARBE[v];
      cx.beginPath();
      for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++)
        if (buf[y * DW + x] === v) cx.rect(x * p + o, y * p + o, d, d);
      cx.fill();
    }
  }
  return { leer, text, mitte, rechts, breite, rahmen, zeichne, groesse, punkt };
})();

      lampenBlitz(l => l.gruppe === 'chase', 1);
    }
  }
  // Mulde oben rechts: kassiert das unterste blinkende Feld der Escape Route
  function mulde() {
    ball.x = MULDE.x; ball.y = MULDE.y; ball.vx = 0; ball.vy = 0;
    ball.halt = 1.0; ball.mulde = true; ball.fluchtBis = 0;
    sfx.loch(); punkte(50000, 2000);
    if (fluchtGeholt >= fluchtLit) { melde('FLUCHTWEG', 'ZIELE IN DER MITTE!', 1.8); return; }
    const k = fluchtGeholt++;
    const t = FLUCHT[k];
    lampenBlitz(l => l.gruppe === 'leiter', 1);
    if (k === 0) {                                             // SEC. PASS: beide Sicherheits-Säulen +1
      sicherL = Math.min(4, sicherL + 1); sicherR = Math.min(4, sicherR + 1); punkte(250000, 5000); melde(t, '250.000', 2);
    } else if (k === 1) { holdBonus = true; melde(t, 'BONUS BLEIBT', 2); }
    else if (k === 2) {                                        // LITE LANES + Hurry Up
      lanesLit = true; if (zeit >= hurryBis) hurryBis = zeit + 20; melde(t, 'HURRY UP!', 2.2);
    } else if (k === 3) {
      if (!multiball && !kanone.kugel) { gunLit = true; sdrop.unten = true; melde(t, 'KANONE LADEN', 2.2); }
      else { punkte(1000000, 10000); melde(t, fmt(1000000), 2); }
    } else if (k === 4) { extraBall = true; melde(t, 'BELEUCHTET', 2.4); }
    else { punkte(10000000, 20000); melde(t, fmt(10000000), 2.8); blitzen(1); lampenBlitz(() => true, 1.5); sfx.multiball(); }
    if (fluchtGeholt >= FLUCHT.length) { fluchtGeholt = 0; fluchtLit = 1; }   // alle sechs: von vorn
  }
  function schaedel() {
    const n = SCHAEDEL_WERT[schaedelIdx];
    punkte(n, 5000);
    sfx.loch(); blitzen(0.8);
    ball.x = SKULL.x; ball.y = SKULL.y; ball.vx = 0; ball.vy = 0;
    ball.halt = 1.2;
    if ((gunLit || multiball) && !kanone.kugel) {
      // Kugel wandert aus dem Schädel über die Drahtbahn in die Kanone; im Multiball = Super-Jackpot-Schuss
      ball.zurKanone = true; gunLit = false; sdrop.unten = multiball;
      melde('KANONE GELADEN', multiball ? 'SUPER JACKPOT!' : 'ABZUG!', 2.2);
    } else if (multiball) jackpot(JACKPOT);
    else melde('SCHÄDEL', fmt(n));
  }
  function trefferSchaedelDrop() {
    sdrop.unten = true;
    punkte(25000, 1000); sfx.ziel();
    if (!multiball && !kanone.kugel) { gunLit = true; melde('LOAD GUN', 'SCHÄDEL SCHIESSEN', 2); }
    lampenBlitz(l => l.gruppe === 'schaedel' || l.gruppe === 'kanone', 0.8);
  }
  // Neues beleuchtetes Rundziel (außerhalb des Multiballs steht es fest, bis die Kanone geschossen hat)
  function neuesZiel() { kanone.ziel = (kanone.ziel + 1 + Math.floor(Math.random() * 4)) % 5; }
  function ladeKanone(b) {
    b.kanone = true; b.zurKanone = false;
    kanone.kugel = b; kanone.phase = 0; kanone.feuerBis = zeit + 7;
    kanone.wechsel = 0;
    sfx.auswurf();
  }
  function feuer() {
    const k = kanone.kugel;
    if (!k) return;
    kanone.kugel = null; k.kanone = false;
    k.x = kanone.x + Math.cos(kanone.a) * (K_LAUF + 4); k.y = kanone.y + Math.sin(kanone.a) * (K_LAUF + 4);
    k.vx = Math.cos(kanone.a) * K_V; k.vy = Math.sin(kanone.a) * K_V;
    k.fliegt = 0.05;
    kanonenSchuss = zeit + 1.3;
    sfx.kanone(); blitzen(0.4); giDip = zeit + 0.1;
  }
  function startMultiball() {
    multiball = true; sdrop.unten = true; jpMult = 1;
    setTimeout(() => sfx.sirene(), 2600);
    nachschub += 2; nachschubBis = zeit + 1;
    saveBis = zeit + 12;
    punkte(500000, 10000);
    melde('MULTIBALL', 'RAMPEN = JACKPOT', 2.8);
    folge = { ab: zeit + 2.8, z1: 'SCHIESS AUF', z2: 'JACKPOT' };
    lampenBlitz(() => true, 1.5); blitzen(1);
    sfx.multiball();
  }
  function blitzen(st) { blitz = Math.max(blitz, st); }

  // ---------- Physik ----------
  function step(dt) {
    zeit += dt;
    for (const f of flippers) {
      const target = f.on ? A_UP : A_REST;
      f.prev = tip(f);
      const da = target - f.a, maxd = A_SPEED * dt;
      f.a += Math.max(-maxd, Math.min(maxd, da));
    }
    if (folge && zeit > folge.ab) { if (multiball) melde(folge.z1, folge.z2, 2.4); folge = null; }
    if (dropReset && zeit > dropReset) { drops.forEach(d => { d.an = false; }); dropReset = 0; }

    // Kanone schwenkt, solange sie geladen ist; nach einigen Sekunden feuert sie selbst
    if (kanone.kugel) {
      kanone.phase += dt * 1.8;
      kanone.a = K_MITTE - K_AMP * Math.cos(kanone.phase);
      kanone.kugel.x = kanone.x + Math.cos(kanone.a) * K_LAUF;
      kanone.kugel.y = kanone.y + Math.sin(kanone.a) * K_LAUF;
      if (zeit > kanone.feuerBis) feuer();
    }
    // Targetlicht: steht fest, bis die Kanone geschossen hat (verfehlt → neues Ziel);
    // im Multiball wandert es (schneller, solange die Kanone geladen ist), nach dem Schuss steht es
    if (kanonenSchuss && zeit > kanonenSchuss) { kanonenSchuss = 0; if (!multiball) neuesZiel(); }
    if (multiball && zeit > kanone.wechsel && zeit > kanonenSchuss) {
      neuesZiel();
      kanone.wechsel = zeit + (kanone.kugel ? 0.9 : 1.6);
    }
    // Nachschub (Multiball, Kugelrettung): Kugeln nacheinander automatisch abschießen
    if (nachschub > 0 && zeit > nachschubBis && !balls.some(b => b.ruht || (b.x > LANE_X && b.y > 560))) {
      const b = neueKugel(false); b.vy = -(1880 + Math.random() * 80);
      balls.push(b); nachschub--; nachschubBis = zeit + 0.9; gestartet = true;
      sfx.schuss(1);
    }

    for (const b of balls) { ball = b; kugelSchritt(dt); }
    stossKugeln();

    const weg = balls.filter(b => b.weg);
    if (weg.length) { balls = balls.filter(b => !b.weg); for (let i = 0; i < weg.length; i++) kugelWeg(); }
    loaded = balls.some(b => b.ruht);
    ball = balls[0] || null;
  }

  function kugelSchritt(dt) {
    if (ball.ruht) {
      // Einrollen: von oben die Rinne hinunter (beschleunigt), unten rastet sie ein – erst dann ist Abschuss möglich
      if (ball.einrollen < 1) {
        ball.einrollen = Math.min(1, ball.einrollen + dt / EINROLL_T);
        if (ball.einrollen >= 1) sfx.ziel();
      }
      const e = ball.einrollen;
      ball.x = SHOOT_X; ball.y = EINROLL_Y + (SHOOT_Y - EINROLL_Y) * Math.pow(e, 2.6); ball.vx = 0; ball.vy = 0; return;
    }
    if (ball.kanone) return;                    // Position bestimmt die Kanone

    // Auf der Rampe: Kugel folgt der Bahn, keine Physik
    if (ball.rampe) {
      ball.rampe.t += dt;
      if (ball.rampe.t >= RAMP_T) {
        const a = ball.rampe.r.aus;
        ball.x = a.x; ball.y = a.y; ball.vx = a.vx; ball.vy = a.vy; ball.rampe = null;
      }
      return;
    }
    // Im Schädel-Loch: festhalten, dann auswerfen – oder in die Kanone schicken
    if (ball.halt > 0) {
      ball.halt -= dt;
      if (ball.halt <= 0) {
        if (ball.zurKanone) ladeKanone(ball);
        else if (ball.mulde) { ball.mulde = false; ball.vx = -20; ball.vy = 260; cool.mulde = zeit + 1; sfx.auswurf(); }
        else { ball.vx = 70; ball.vy = 330; cool.schaedel = zeit + 1; sfx.auswurf(); }
      }
      return;
    }

    ball.vy += G * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Frisch aus der Kanone: kurz über die Führungsschiene hinwegfliegen
    if (ball.fliegt > 0) ball.fliegt -= dt;
    else {
      for (const w of walls) {
        if (w.nurRunter && ball.vy <= 0) continue;
        const c = collideSeg(w.x1, w.y1, w.x2, w.y2, R, REST_WALL);
        if (c && w.kick && -c.vn > 60 && frei('sling' + w.kick.seite, 0.15)) {
          ball.vx += c.nx * 420; ball.vy += c.ny * 420;
          w.kick.flash = 1;
          punkte(1000, 500); sfx.schleuder();
        }
      }
    }
    for (const p of posts) collideCircle(p.x, p.y, p.r, REST_WALL);

    for (const [bi, b] of bumpers.entries()) {
      const c = collideCircle(b.x, b.y, b.r, 1);
      if (c) {
        ball.vx += c.nx * 280; ball.vy += c.ny * 280;
        if (frei('bumper' + bi, 0.08)) {
          punkte(5000, 500); sfx.bumper(bi);
          bumperTreffer++;
          if (bumperTreffer >= 50) { bumperTreffer = 0; punkte(250000, 5000); melde('BUMPER SERIE', '250.000'); }
        }
        b.flash = 1;
      }
    }
    if (!sdrop.unten && ball.y > sdrop.y &&
      collideSeg(sdrop.x0, sdrop.y, sdrop.x1, sdrop.y, R + 3, REST_WALL) && frei('sdrop', 0.3)) trefferSchaedelDrop();
    drops.forEach((d, i) => {
      const c = collideSeg(d.x - d.w / 2, d.y, d.x + d.w / 2, d.y, R + 3, REST_WALL);
      if (c && -c.vn > 40 && frei('rot' + i, 0.25)) trefferDrop(i);
    });
    standups.forEach((s, i) => {
      const c = collideSeg(s.x, s.y - s.h / 2, s.x, s.y + s.h / 2, R + 2, REST_WALL);
      if (c && -c.vn > 40 && frei('stand' + i, 0.3)) trefferStandup(i);
    });
    // Rundziele: nur von der Spielfeldseite (nicht aus der Umlauf-Gasse); das nächstgelegene zählt
    if (ball.x > RUND_X && ball.x < RUND_X + R + 6 && ball.y > 376 && ball.y < 456) {
      let best = -1, bd = 1e9;
      rund.forEach((r, i) => {
        const c = collideSeg(r.x, r.y - r.h / 2, r.x, r.y + r.h / 2, R + 2, REST_WALL);
        const d = Math.abs(ball.y - r.y);
        if (c && -c.vn > 40 && d < bd) { bd = d; best = i; }
      });
      if (best >= 0 && frei('rund', 0.3)) trefferRund(best);
    }

    for (const f of flippers) {
      const t = tip(f);
      const svx = (t.x - f.prev.x) / dt, svy = (t.y - f.prev.y) / dt;
      collideSeg(f.px, f.py, t.x, t.y, R + 7, REST_FLIP, svx, svy);
    }

    // ---- Schalter ----
    // obere Gassen
    if (ball.y > 55 && ball.y < 90) {
      [166, 202, 238].forEach((x, i) => {
        if (Math.abs(ball.x - x) < 12 && frei('top' + i, 0.6)) topLane(i);
      });
    }
    // Rampeneinfahrt: nur mit genug Schwung nach oben
    for (const r of ramps) {
      if (ball.x > r.ein.x0 && ball.x < r.ein.x1 && Math.abs(ball.y - r.ein.y) < 8 && ball.vy < -250) {
        rampe(r); return;
      }
    }
    // Schädel-Loch (ist es schon belegt, prallt die zweite Kugel ab)
    if ((cool.schaedel || 0) < zeit && !haelt() && Math.hypot(ball.x - SKULL.x, ball.y - SKULL.y) < 22) { schaedel(); return; }
    // Umlauf links hinauf
    if (ball.x < 58 && Math.abs(ball.y - 320) < 10 && ball.vy < -150 && frei('orbit', 1.5)) {
      orbits++;
      if (orbits >= 5) { orbits = 0; punkte(25000, 2000); starteWahl(); }
      else { punkte(25000, 2000); melde('FLUCHTWEG', '25.000'); }
      ball.fluchtBis = zeit + 3;
      sfx.gasse();
    }
    // Chase Loop: rechter Umlauf hinauf (nicht die Abschussrinne, die liegt rechts von LANE_X).
    // Die Kugel läuft über den Bogen und den linken Umlauf zurück zum linken Flipper; schnell wiederholt = Kombo
    if (ball.x > 330 && ball.x < LANE_X - 2 && Math.abs(ball.y - 340) < 10 && ball.vy < -150 && frei('chase', 1.2)) chaseLoop();
    // Aus dem linken Umlauf über den Bogen in die Mulde oben rechts
    if (ball.fluchtBis > zeit && ball.vy > 0 && ball.x > 326 && Math.abs(ball.y - MULDE.y) < 14 &&
      (cool.mulde || 0) < zeit && !balls.some(b => b.mulde)) { mulde(); return; }
    // Rückkehrgassen: beleuchtet nach LITE LANES
    if (ball.vy > 0 && Math.abs(ball.y - 600) < 8) {
      if (ball.x > 40 && ball.x < 70 && frei('inL', 0.8)) inlane();
      if (ball.x > 306 && ball.x < 336 && frei('inR', 0.8)) inlane();
    }

    // Tempolimit gegen Durchtunneln
    const sp = Math.hypot(ball.vx, ball.vy), VMAX = 2200;
    if (sp > VMAX) { ball.vx *= VMAX / sp; ball.vy *= VMAX / sp; }

    // Kickback in der rechten Ausgasse: schießt die Kugel zurück ins Spiel
    if (kickback && ball.x > 338 && ball.x < LANE_X && ball.y > 660 && ball.vy > 0) {
      kickback = false; ball.vx = -40; ball.vy = -1250; sfx.kanone(); giDip = zeit + 0.1; melde('KICKBACK', '', 1.2);
    }
    if (ball.y > H + 20) ball.weg = true;
  }
  function inlane() {
    if (lanesLit) { punkte(25000, 1000); sfx.gasse(); }
    else punkte(1000, 500);
  }

  // Eine Kugel ist ins Aus gegangen
  function kugelWeg() {
    // Kugelrettung: kurz nach dem Abschuss (und zu Beginn des Multiballs) kommt sie zurück
    if (zeit < saveBis) {
      if (!multiball) { melde('KUGEL GERETTET', '', 1.6); saveBis = 0; }
      nachschub++; nachschubBis = Math.max(nachschubBis, zeit + 0.7);
      return;
    }
    const rest = balls.length + nachschub;
    if (rest > 0) {
      if (multiball && rest <= 1) { multiball = false; sdrop.unten = gunLit; melde('MULTIBALL', 'VORBEI', 1.6); }
      return;
    }
    // Letzte Kugel verloren: Bonus zählen, nächste Kugel
    if (multiball) sdrop.unten = gunLit;
    multiball = false;
    const b = bonus * MULTI[multi];
    score += b;
    melde('BONUS ' + fmt(bonus), '× ' + MULTI[multi] + ' = ' + fmt(b), 2.4);
    if (holdBonus) holdBonus = false;         // Hold Bonus: Bonus und Multiplikator gehen auf die nächste Kugel über
    else { bonus = 0; multi = 0; }
    if (extraBall) { extraBall = false; melde('NOCHMAL', 'EXTRA BALL', 2); }
    else if (ballNo >= 3) gameOver = true;
    else ballNo++;
    newBall();
  }

  // Abzug: Kugel abschießen oder Kanone feuern (wie der Pistolengriff im Original)
  function abschuss() {
    const b = balls.find(x => x.ruht && x.einrollen >= 1);
    if (!b) return;
    b.ruht = false; loaded = false; gestartet = true;

    saveBis = zeit + SAVE_T;

  // ---- Auswahlmenü: Flipper-Knöpfe wählen, Abzug bestätigt, nach 8 s automatisch ----
  let wahl = null;
  const WAHL = [
    { t: 'MULTIBALL', f: () => { if (!multiball) startMultiball(); else jackpot(JACKPOT); } },
    { t: 'BEL. EXTRA BALL', f: () => { extraBall = true; melde('EXTRA BALL', 'BELEUCHTET', 2); } },
    { t: '500.000', f: () => { punkte(500000, 5000); melde('500.000', '', 1.6); } },
    { t: 'PAYBACK ZEIT', f: () => { paybackBis = zeit + 25; melde('PAYBACK ZEIT', 'ALLES × 2', 2.4); } },
  ];

  function wahlBewegen(d) { if (!wahl) return false; wahl.i = (wahl.i + d + WAHL.length) % WAHL.length; sfx.ziel(); return true; }
  function wahlFertig() { const w = WAHL[wahl.i]; wahl = null; w.f(); lampenBlitz(() => true, 0.8); sfx.multiball(); }

  function abzug() {
    if (gameOver) { restart(); return; }
    if (wahl) { wahlFertig(); return; }
    if (kanone.kugel) { feuer(); return; }
    abschuss();
  }

  // Für den Update-Mechanismus: automatisch neu laden nur, wenn kein Spiel läuft
  window.spielRuht = () => gameOver || (loaded && score === 0 && ballNo === 1);

  function restart() {
    score = 0; ballNo = 1; gameOver = false; bonus = 0; multi = 0;
    fluchtLit = 1; fluchtGeholt = 0; holdBonus = false; lanesLit = false;
    extraBall = false; extraVergeben = false; saveBis = 0;
    schaedelIdx = 0; bankReihen = 0; orbits = 0; bumperTreffer = 0; gestartet = false; chaseKette = 0; chaseBis = 0;
    gunLit = false; sdrop.unten = false; multiball = false; nachschub = 0; kanone.kugel = null; kanonenSchuss = 0; rundTreffer = null;
    topLanes.fill(false); drops.forEach(d => { d.an = false; }); standups.forEach(s => { s.an = false; });
    paybackBis = 0; kickback = false; jpMult = 1; jpShow = -99; folge = null; sicherL = 0; sicherR = 0; wahl = null; hurryBis = 0;
    newBall();
  }

  // ================= Licht =================
  // Einsatzlampen im Spielfeld: Form, Farbe, Beschriftung und wann sie leuchten.
  // Zustand: 0 aus · 1 an · 2 blinkt · 3 Lauflicht (Phase über .k)
  const FARBE = {
    rot: '#ff3040', gelb: '#ffd23a', gruen: '#2fe07a', weiss: '#eaf4ff', amber: '#ff9a2e', blau: '#46b0ff',
  };
  const lamps = [];

  const chase = (k, n = 3, rate = 5) => (Math.floor(zeit * rate) % n) === k ? 1 : 0;

  // Pfeile in der Schädel-Gasse (Lauflicht Richtung Loch)
  [
    ['amber', () => zeit < paybackBis ? 2 : 0],                                  // SUPER: Payback läuft
    ['gruen', () => kanone.kugel ? 1 : (gunLit ? 2 : 0)],                         // LOAD GUN
    ['rot', () => extraBall ? 1 : 0],                                              // EXTRA BALL
    ['blau', () => multiball ? 2 : 0],                                             // JACKPOT im Multiball
    ['weiss', () => haelt() ? 1 : 3],                                              // TIMER: Lauflicht zum Loch
  ].forEach(([farbe, z], k) => L({ form: 'pfeil', x: 97 - k * 1.5, y: 352 - k * 20, w: 17, h: 17, dir: -PI / 2 - 0.12,
    farbe, gruppe: 'schaedel', z, k: 0 }));
  // Pfeile vor den Rampen: Lauflicht, solange die Säule der Rampe noch nicht voll ist
  [[156, 462], [156, 438]].forEach(([x, y], k) => L({ form: 'pfeil', x, y, w: 16, h: 16, dir: -PI / 2, farbe: 'weiss',
    gruppe: 'rampe', z: () => sicherL < 5 ? 3 : 1, k }));
  [[278, 452], [278, 428]].forEach(([x, y], k) => L({ form: 'pfeil', x, y, w: 16, h: 16, dir: -PI / 2, farbe: 'gelb',
    gruppe: 'rampe', z: () => sicherR < 5 ? 3 : 1, k }));
  // Umlauf-Pfeil links
  L({ form: 'pfeil', x: 35, y: 420, w: 16, h: 18, dir: -PI / 2, farbe: 'amber', gruppe: 'orbit', z: () => 2 });
  // Chase Loop rechts: Pfeil im rechten Umlauf – Lauflicht, blinkt schnell, solange die Kombo-Zeit läuft
  [0, 1].forEach(k => L({ form: 'pfeil', x: 345, y: 372 - k * 20, w: 15, h: 16, dir: -PI / 2, farbe: 'blau', label: k ? '' : 'CHASE',
    gruppe: 'chase', z: () => zeit < chaseBis ? 2 : 3, k }));
  // Kleine rote Pfeile unter den Klappzielen
  drops.forEach((d, i) => L({ form: 'pfeil', x: d.x, y: 292, w: 12, h: 14, dir: -PI / 2, farbe: 'rot', gruppe: 'drop',
    z: () => d.an ? 1 : 3, k: i }));
  // Rechts an der Ausgasse: drei Rundlampen (Stehziele) und KICKBACK
  standups.forEach((st, i) => L({ form: 'kreis', x: 350, y: 596 + i * 11, r: 4.5, farbe: 'amber', gruppe: 'kick', z: () => st.an || kickback ? 1 : 0 }));
  L({ form: 'rechteck', x: 350, y: 640, w: 24, h: 10, farbe: 'rot', label: 'KICK', gruppe: 'kick', z: () => kickback ? 1 : 0 });
  // Rundziele: gelbe Winkel-Lampe vor jedem Ziel zeigt das wandernde Targetlicht (blinkt bei geladener Kanone)
  rund.forEach((r, k) => L({ form: 'trapez', x: 81, y: r.y, w: 16, h: 6, farbe: 'gelb', gruppe: 'rund', rand: true,
    z: () => kanone.ziel === k ? (kanone.kugel ? 2 : 1) : 0 }));
  // „LOAD GUN“: nächster Schädel-Treffer lädt die Kanone
  L({ form: 'rechteck', x: 117, y: 372, w: 42, h: 10, farbe: 'gruen', label: 'LOAD GUN', gruppe: 'kanone',
    z: () => kanone.kugel ? 1 : (gunLit ? 2 : 0) });
  // Mulde oben rechts: Pfeil blinkt, solange ein Fluchtweg-Feld zum Kassieren bereitsteht
  L({ form: 'pfeil', x: 345, y: 280, w: 14, h: 16, dir: -PI / 2, farbe: 'gruen', gruppe: 'leiter',
    z: () => fluchtGeholt < fluchtLit ? 2 : 0 });
  // HURRY UP vor der rechten Rampe: blinkt, solange der Countdown-Wert läuft
  L({ form: 'pfeil', x: 313, y: 425, w: 16, h: 22, dir: -PI / 2, farbe: 'weiss', label: 'HURRY', gruppe: 'hurry',

    ctx.moveTo(cx - r - 5, cy); ctx.lineTo(cx - 3, cy); ctx.moveTo(cx + 3, cy); ctx.lineTo(cx + r + 5, cy);
    ctx.moveTo(cx, cy - r - 5); ctx.lineTo(cx, cy - 3); ctx.moveTo(cx, cy + 3); ctx.lineTo(cx, cy + r + 5);
    ctx.stroke();
    ctx.fillStyle = farbe(0.8); ctx.beginPath(); ctx.arc(cx, cy, 1.4, 0, 2 * PI); ctx.fill();
    // Geladene Kanone: Visier-Ring auf dem beleuchteten Ziel
    if (geladen) {
      const z = rund[kanone.ziel];
      ctx.lineWidth = 1.5; ctx.strokeStyle = farbe(0.7 + 0.3 * p);
      ctx.beginPath(); ctx.arc(z.x + 3, z.y, 9 + 2 * p, 0, 2 * PI); ctx.stroke();
    }
    ctx.restore();
  }
  // Fünf weiße Rundziele; das beleuchtete glüht
  function zeichneRundziele() {
    for (const [k, r] of rund.entries()) {
      r.blitz = Math.max(0, r.blitz - 0.05);
      const lit = kanone.ziel === k;
      ctx.fillStyle = '#c9d4df'; ctx.fillRect(r.x - 3, r.y - r.h / 2, 3, r.h);             // Halter
      ctx.beginPath(); ctx.arc(r.x + 3, r.y, 6, 0, 2 * PI);
      ctx.fillStyle = r.blitz > 0 ? '#ffffff' : lit ? '#fffbe8' : '#d8dde3'; ctx.fill();
      ctx.lineWidth = lit ? 2 : 1; ctx.strokeStyle = lit ? '#ffd23a' : '#5c6672'; ctx.stroke();
    }
  }

  function draw(dt) {
    ctx.drawImage(grund, 0, 0, W, H);

    // Uhrzeiger: wandert mit jedem kassierten Fluchtweg-Feld auf zwölf
    const za = -PI / 2 - (6 - fluchtGeholt) * 0.42;
    ctx.strokeStyle = fluchtGeholt >= 5 ? '#ff3a3a' : '#ffb347'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(188, 500); ctx.lineTo(188 + Math.cos(za) * 22, 500 + Math.sin(za) * 22); ctx.stroke();

    zeichneEinsaetze();

    // Schleudern: rote Kunststoffkappe, leuchtet beim Schlag
    for (const s of slings) {
      s.flash = Math.max(0, s.flash - dt * 8);
      const drei = () => { ctx.beginPath(); ctx.moveTo(...s.pts[0]); ctx.lineTo(...s.pts[1]); ctx.lineTo(...s.pts[2]); ctx.closePath(); };
      if (schleuderBildOk()) {
        // Bild samt Gummi und Pfosten (links gebaut, Pfosten exakt auf den drei Ecken; Ausschnitt ab 60/562, 54 × 96);
        // rechte Schleuder gespiegelt an x = 188
        ctx.save();
        if (s.seite < 0) { ctx.translate(376, 0); ctx.scale(-1, 1); }
        ctx.drawImage(schleuderBild, 60, 562, 54, 96);
        ctx.restore();
      } else { drei(); ctx.fillStyle = '#8a1e2b'; ctx.fill(); }
      if (s.flash > 0) {                                                               // Schlag: grell aufleuchten
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; drei();
        ctx.fillStyle = `rgba(255,190,170,${0.8 * s.flash})`; ctx.fill(); ctx.restore();
      }
      if (!schleuderBildOk()) {
        ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(...s.pts[2]); ctx.lineTo(...s.pts[0]); ctx.stroke();
      }
    }
    zeichneWaende();

    for (const p of posts) {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 2 * PI); ctx.fillStyle = '#d8e2ec'; ctx.fill();
      ctx.strokeStyle = '#1a1f27'; ctx.lineWidth = 1; ctx.stroke();
    }

    // Klappziele + Stehziele
    // Rote Stehziele: runde Scheibe mit Niete auf schwarzer Halterung; getroffen = hell leuchtend
    ctx.fillStyle = '#15171c'; ctx.fillRect(drops[0].x - 12, drops[0].y + 2, drops[2].x - drops[0].x + 24, 5);   // Halterung
    for (const d of drops) {
      d.blitz = Math.max(0, d.blitz - dt * 6);
      const hell = d.an ? 1 : d.blitz;
      const dg = ctx.createRadialGradient(d.x - 3, d.y - 4, 1, d.x, d.y, 10);
      dg.addColorStop(0, hell ? '#ffd0d4' : '#ff8a94'); dg.addColorStop(0.55, hell ? '#ff4050' : '#c8202e'); dg.addColorStop(1, '#6e0a14');
      ctx.beginPath(); ctx.ellipse(d.x, d.y - 1, 9, 8.5, 0, 0, 2 * PI); ctx.fillStyle = dg; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(40,0,5,.7)'; ctx.stroke();
      ctx.fillStyle = '#c9d0d8'; ctx.beginPath(); ctx.arc(d.x, d.y - 1, 1.8, 0, 2 * PI); ctx.fill();   // Niete
      if (hell) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55 * hell;
        ctx.drawImage(glow('#ff3040'), d.x - 16, d.y - 17, 32, 32); ctx.restore(); }
    }
    for (const s of standups) {
      ctx.fillStyle = s.an ? '#ffe7b0' : '#e9eef4';
      ctx.fillRect(s.x - 3, s.y - s.h / 2, 6, s.h);
    }
    zeichneRundziele();
    // Mulde oben rechts (Escape Route)
    ctx.beginPath(); ctx.arc(MULDE.x, MULDE.y, 12, 0, 2 * PI); ctx.fillStyle = '#c9d4df'; ctx.fill();
    ctx.beginPath(); ctx.arc(MULDE.x, MULDE.y, 9, 0, 2 * PI); ctx.fillStyle = '#030406'; ctx.fill();
    // Klappziel vor dem Schädel: Chromplatte über die ganze Gasse
    if (sdrop.unten) { ctx.fillStyle = '#2a1a20'; ctx.fillRect(sdrop.x0 + 4, sdrop.y - 1.5, sdrop.x1 - sdrop.x0 - 8, 3); }
    else {
      const pg = ctx.createLinearGradient(0, sdrop.y - 5, 0, sdrop.y + 5);
      pg.addColorStop(0, '#f4f8fc'); pg.addColorStop(0.5, '#7d8a98'); pg.addColorStop(1, '#c9d4df');
      ctx.fillStyle = pg; ctx.fillRect(sdrop.x0 + 2, sdrop.y - 5, sdrop.x1 - sdrop.x0 - 4, 10);
      ctx.fillStyle = gunLit ? '#2fe07a' : '#8a1e2b'; ctx.fillRect((sdrop.x0 + sdrop.x1) / 2 - 8, sdrop.y - 2, 16, 4);
    }

    // Pop-Bumper: Metallring, rote leuchtende Kappe
    for (const b of bumpers) {
      b.flash = Math.max(0, b.flash - dt * 7);
      const f = b.flash, r = b.r;
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(b.x + 3, b.y + 4, r + 3, 0, 2 * PI); ctx.fill();   // Schatten
      ctx.fillStyle = '#eef0f2'; ctx.beginPath(); ctx.arc(b.x, b.y, r + 2.5, 0, 2 * PI); ctx.fill();               // weißer Sockel
      // breiter, durchscheinender Rand der Kappe
      const g = ctx.createRadialGradient(b.x, b.y, r * 0.5, b.x, b.y, r + 1);
      g.addColorStop(0, `rgba(${210 + 45 * f},${40 + 60 * f},${50 + 50 * f},.92)`); g.addColorStop(1, 'rgba(150,12,24,.95)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, r + 1, 0, 2 * PI); ctx.fill();
      ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(255,150,160,.55)'; ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.78, 0, 2 * PI); ctx.stroke();  // Innenring
      // erhöhter Deckel mit Glanz; leuchtet beim Treffer hell auf
      const d = ctx.createRadialGradient(b.x - r * 0.25, b.y - r * 0.3, 1, b.x, b.y, r * 0.6);
      d.addColorStop(0, f > 0.05 ? '#ffffff' : '#ff9aa4'); d.addColorStop(0.6, f > 0.05 ? '#ff6070' : '#e22a3a'); d.addColorStop(1, '#8e0f1a');
      ctx.fillStyle = d; ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.58, 0, 2 * PI); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(b.x - r * 0.42, b.y - r * 0.5, r * 0.28, r * 0.13, -0.6, 0, 2 * PI); ctx.fill();  // Glanzlicht
    }

    // Schädel über dem Loch: Stahlplatten-Schädel (Bild schaedel.png), Augen glühen orange
    if (schaedelBild && schaedelBild.complete && schaedelBild.naturalWidth) {
      const sw = 66, sh = sw * schaedelBild.naturalHeight / schaedelBild.naturalWidth, sx = SKULL.x - sw / 2, sy = SKULL.y - 8 - sh;
      ctx.drawImage(schaedelBild, sx, sy, sw, sh);
      const glut = haelt() ? 1 : 0.35 + 0.3 * Math.sin(zeit * 3);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = glut;
      for (const ax of [0.268, 0.723]) ctx.drawImage(glow('#ff9a2e'), sx + ax * sw - 12, sy + 0.597 * sh - 12, 24, 24);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    ctx.beginPath(); ctx.arc(SKULL.x, SKULL.y, 10, 0, 2 * PI); ctx.fillStyle = '#030406'; ctx.fill();

    // Abschussrinne: Kolben
    ctx.fillStyle = '#9fb3c8'; ctx.fillRect(LANE_X + 5, SHOOT_Y + R, 392 - LANE_X - 10, 6);

    // Tipp-Hinweis unter den Rückkehrgassen: dezenter Ring mit Punkt je Seite, leuchtet beim Flipperschlag auf
    flippers.forEach((f, k) => {
      const x = k ? 310 : 66, y = 714, a = f.on ? 0.55 : 0.16;
      ctx.strokeStyle = `rgba(190,215,240,${a})`; ctx.fillStyle = `rgba(190,215,240,${a})`;
      ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(x, y, 13, 0, 2 * PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 4, 0, 2 * PI); ctx.fill();
      ctx.lineWidth = 1.2; ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(x, y, 19, -PI * 0.85, -PI * 0.15); ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // Flipper: weißer Körper, rotes Gummi
    const flipperForm = (f, t, r0, r1) => {
      const dx = t.x - f.px, dy = t.y - f.py, l = Math.hypot(dx, dy), w = Math.atan2(dy, dx), s = Math.asin((r0 - r1) / l);
      ctx.beginPath();
      ctx.arc(f.px, f.py, r0, w + PI / 2 + s, w - PI / 2 - s);          // runder Kopf am Drehpunkt
      ctx.arc(t.x, t.y, r1, w - PI / 2 - s, w + PI / 2 + s);            // schmale runde Spitze
      ctx.closePath();
    };
    for (const f of flippers) {
      const t = tip(f);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.save(); ctx.translate(3, 4); flipperForm(f, t, 9, 5.5); ctx.fill(); ctx.restore();
      ctx.fillStyle = '#c21f2f'; flipperForm(f, t, 9, 5.5); ctx.fill();                          // rotes Gummi
      const g = ctx.createLinearGradient(f.px, f.py - 7, f.px, f.py + 7);
      g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#d9d4c8');
      ctx.fillStyle = g; flipperForm(f, t, 6.8, 3.6); ctx.fill();                                 // weißer Körper
      ctx.fillStyle = '#9aa3ad'; ctx.beginPath(); ctx.arc(f.px, f.py, 2.2, 0, 2 * PI); ctx.fill(); // Achse
    }

    // Kugeln: Position (auf der Rampe entlang der Bahn), Schatten
    const lage = balls.map(b => {
      if (b.rampe) { const [x, y] = bez(b.rampe.r.pfad, Math.min(1, b.rampe.t / RAMP_T)); return { x, y, hoch: 1 }; }
      return { x: b.x, y: b.y, hoch: b.kanone ? 2 : 0 };
    });
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    for (const p of lage) if (!p.hoch) { ctx.beginPath(); ctx.ellipse(p.x + 3, p.y + 4, R, R * 0.8, 0, 0, 2 * PI); ctx.fill(); }

    // Rampen: klarer Kunststoff mit Drahtschienen
    for (const r of ramps) {
      r.flash = Math.max(0, r.flash - dt * 2.5);
      const bahn = () => { ctx.beginPath(); ctx.moveTo(...r.pfad[0]); ctx.bezierCurveTo(...r.pfad[1], ...r.pfad[2], ...r.pfad[3]); };
      // Die Rampe liegt ÜBER dem Spielfeld (auch über den Bumpern): Schatten, getönter Kunststoff, zwei helle Schienen
      ctx.save(); ctx.translate(5, 7);
      bahn(); ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 18; ctx.stroke();
      ctx.restore();
      bahn(); ctx.strokeStyle = 'rgba(120,170,220,.16)'; ctx.lineWidth = 14; ctx.stroke();      // Kunststoff: nur leicht getönt
      // Zwei kräftige Schienen: auf eigener Ebene breit zeichnen, Mitte ausstanzen, dann übertragen
      const sx = schienen.getContext('2d');
      if (schienen.width !== cv.width || schienen.height !== cv.height) { schienen.width = cv.width; schienen.height = cv.height; }
      sx.setTransform(1, 0, 0, 1, 0, 0); sx.clearRect(0, 0, schienen.width, schienen.height);
      sx.setTransform(ctx.getTransform ? ctx.getTransform() : new DOMMatrix());
      const sbahn = () => { sx.beginPath(); sx.moveTo(...r.pfad[0]); sx.bezierCurveTo(...r.pfad[1], ...r.pfad[2], ...r.pfad[3]); };
      sbahn(); sx.strokeStyle = 'rgba(235,245,255,.95)'; sx.lineWidth = 18; sx.stroke();
      sx.globalCompositeOperation = 'destination-out'; sbahn(); sx.lineWidth = 13; sx.stroke(); sx.globalCompositeOperation = 'source-over';
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(schienen, 0, 0); ctx.restore();
      bahn(); ctx.strokeStyle = `rgba(150,200,255,${0.10 + 0.5 * r.flash})`; ctx.lineWidth = 9; ctx.stroke();
    }

    ctx.fillStyle = 'rgba(0,0,0,.35)';
    for (const p of lage) if (p.hoch) { ctx.beginPath(); ctx.ellipse(p.x + 7, p.y + 9, R, R * 0.8, 0, 0, 2 * PI); ctx.fill(); }

    zeichneZielmarke();
    zeichneKanone();
    zeichneAbzug();
    for (const p of lage) {
      const g = ctx.createRadialGradient(p.x - 3, p.y - 3, 1, p.x, p.y, R);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#d7dee6'); g.addColorStop(0.75, '#7c8794'); g.addColorStop(1, '#2d333b');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.hoch === 1 ? R * 1.2 : R, 0, 2 * PI); ctx.fill();
    }

    // Grundbeleuchtung: dunkel = Tisch abdunkeln, nur Einsätze (Leuchtschein) glühen weiter; > 1 = heller Rückschlag
    const gi = grundLicht();
    if (gi < 1) { ctx.fillStyle = `rgba(2,3,6,${(1 - gi) * 0.82})`; ctx.fillRect(0, 0, W, H); }
    zeichneLeuchtschein();
    if (gi > 1) {
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,240,220,${(gi - 1) * 0.35})`;
      ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    }
    blitz = Math.max(0, blitz - dt * 3);

    if (gameOver) {
      ctx.fillStyle = 'rgba(8,10,16,.55)'; ctx.fillRect(0, 0, W, H);
    }
  }

  // ================= Punktmatrix-Inhalt =================
  function anzeige() {
    dmd.leer();
    const blink = Math.floor(zeit * 4) % 2;
    if (zeit - jpShow >= 0.6 && zeit - jpShow < 1.2) {
      // Jackpot-Dunkelphase: nur die Punktzahl, groß
      const t = fmt(score), s = dmd.breite(t, 2) <= 126 ? 2 : 1;
      dmd.mitte(t, s === 2 ? 9 : 13, s, 3);
    } else if (meldung && zeit < meldung.bis) {
      const alter = zeit - meldung.von;
      dmd.rahmen(1);
      if (meldung.z2) {
        dmd.mitte(meldung.z1, 4, 1, 3);
        const s = dmd.breite(meldung.z2, 2) <= 124 ? 2 : 1;
        if (alter > 0.6 || blink) dmd.mitte(meldung.z2, s === 2 ? 14 : 18, s, 3);
      } else {
        const s = dmd.breite(meldung.z1, 2) <= 124 ? 2 : 1;
        dmd.mitte(meldung.z1, s === 2 ? 9 : 13, s, 3);
      }
    } else if (wahl) {
      dmd.text('WAHLMÖGLICHKEITEN:', 1, 0, 1, 3);
      const start = Math.max(0, Math.min(WAHL.length - 3, wahl.i - 1));
      for (let k = 0; k < 3; k++) {
        const j = start + k, y = 9 + k * 8, sel = j === wahl.i;
        dmd.text((sel ? (blink ? '>' : ' ') : ' ') + WAHL[j].t, 3, y, 1, sel ? 3 : 1);
      }
      dmd.rechts(String(Math.max(0, Math.ceil(wahl.bis - zeit))), 17, 1, 2);
    } else if (kanone.kugel) {
      // Fadenkreuz folgt dem Kanonenwinkel, das Kästchen zeigt das Ziel
      const kx = 20 + Math.round(kLage(kanone.a) * 88), ky = 12;
      const zx = 20 + Math.round(RUND_LAGE[kanone.ziel] * 88);
      for (let a = 0; a < 2 * PI; a += 0.15) dmd.punkt(Math.round(kx + Math.cos(a) * 7), Math.round(ky + Math.sin(a) * 7), 3);
      for (let d = -10; d <= 10; d++) { if (Math.abs(d) > 2) { dmd.punkt(kx + d, ky, 3); dmd.punkt(kx, ky + d, 3); } }
      for (let d = -4; d <= 4; d++) { dmd.punkt(zx + d, ky - 4, 2); dmd.punkt(zx + d, ky + 4, 2); dmd.punkt(zx - 4, ky + d, 2); dmd.punkt(zx + 4, ky + d, 2); }
      const rest = Math.ceil(kanone.feuerBis - zeit);
      if (rest <= 5 && rest > 0) dmd.text(String(rest), 110, 3, 3, 3);
      dmd.mitte(Math.floor(zeit * 1.5) % 2 ? 'KANONE ANTIPPEN' : 'FEUER FREI', 24, 1, blink ? 3 : 2);
    } else if (gameOver) {
      if (Math.floor(zeit * 0.5) % 2 === 0) { dmd.mitte('GAME OVER', 3, 2, 3); dmd.mitte(fmt(score), 22, 1, 2); }
      else { dmd.mitte('ANTIPPEN', 8, 1, 3); dmd.mitte('FÜR NEUES SPIEL', 18, 1, 2); }
    } else if (!gestartet && loaded) {
      dmd.mitte('ZERO TIME', 3, 2, 3);
      if (blink) dmd.mitte('KUGEL ANTIPPEN', 22, 1, 2);
    } else {
      const t = fmt(score), s = dmd.breite(t, 2) <= 126 ? 2 : 1;
      dmd.mitte(t, s === 2 ? 2 : 6, s, 3);
      dmd.text('KUGEL ' + ballNo, 1, 24, 1, 2);
      if (zeit < hurryBis) dmd.mitte(fmt(hurryWert()), 24, 1, blink ? 3 : 2);
      else if (zeit < paybackBis) dmd.mitte('PB ' + Math.ceil(paybackBis - zeit), 24, 1, blink ? 3 : 2);
      else dmd.mitte(multiball ? 'JP ' + jpMult + 'X' : MULTI[multi] + 'X', 24, 1, 2);
      dmd.rechts('FLUCHT ' + fluchtGeholt, 24, 1, 2);
    }
    dmd.zeichne();
  }

  // ---------- Skalierung ----------
  let scale = 1;
  function resize() {
    const st = document.getElementById('stage').getBoundingClientRect();
    const kopf = document.getElementById('kopf');
    kopf.style.transform = '';
    const setze = s => { scale = s; cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; };
    setze(Math.min(st.width / W, st.height / H));
    // Schräg gestellt ist der Tisch sichtbar niedriger: so weit vergrößern, bis er oben an die Anzeige stößt –
    // aber nie darüber (sonst verdeckt er die untere Anzeigezeile)
    for (let i = 0; i < 6; i++) {
      const r = cv.getBoundingClientRect(), frei = r.top - kopf.getBoundingClientRect().bottom - 6;
      if (!(r.height > 0) || Math.abs(frei) < 1) break;
      const neu = Math.min(st.width / W, scale * (1 + frei / r.height));
      if (Math.abs(neu - scale) < 1e-4) break;
      setze(neu);
    }
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    grund = baueGrund(Math.min(3, scale * dpr));
    // Bleibt (breitenbegrenzt) Luft, rückt die Anzeige direkt über den Tisch; die Restluft bleibt oben am Rand
    const luecke = cv.getBoundingClientRect().top - kopf.getBoundingClientRect().bottom - 6;
    if (luecke > 0) kopf.style.transform = `translateY(${luecke}px)`;
  }
  window.addEventListener('resize', resize);
  resize();
  // Schrift „Bungee“ kann später nachladen: dann Grund neu zeichnen
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);

  // ---------- Eingabe ----------
  // Flipper: linke / rechte Bildschirmhälfte antippen (mehrere Finger gleichzeitig möglich)
  const finger = new Map();                       // pointerId → 0 (links) / 1 (rechts)
  const halte = seite => { flippers[seite].on = [...finger.values()].includes(seite); };
  window.addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('#start, #update')) return;
    e.preventDefault();
    if (gameOver) { restart(); return; }
    if (imAbzugFeld(e.clientX, e.clientY)) { abzugGedrueckt = zeit + 0.15; abzug(); return; }
    const seite = e.clientX < window.innerWidth / 2 ? 0 : 1;
    if (wahlBewegen(seite ? 1 : -1)) return;
    if (!flippers[seite].on) { sfx.flipper(); gassenWechsel(seite ? 1 : -1); }
    finger.set(e.pointerId, seite); halte(seite);
  }, { passive: false });
  const los = e => { if (!finger.has(e.pointerId)) return; const s = finger.get(e.pointerId); finger.delete(e.pointerId); halte(s); };
  ['pointerup', 'pointercancel'].forEach(ev => window.addEventListener(ev, los));
  window.addEventListener('contextmenu', e => e.preventDefault());
  // Abzug-Feld: Abschussrinne unten rechts (großzügig; unten ist die schräge Ansicht fast unverzerrt)
  // Bildschirmpunkt → Tischkoordinaten, exakt für die schräge Ansicht (rotateX um die Unterkante, Perspektive der Bühne)
  const NEIGUNG = 10 * PI / 180, PERSP = 1300;
  function tischPunkt(cx, cy) {
    const stage = document.getElementById('stage'), st = stage.getBoundingClientRect();
    const ox = st.left + st.width / 2, oy = st.top + st.height / 2;
    const unten = st.bottom - (parseFloat(getComputedStyle(stage).paddingBottom) || 0);
    const v = (unten - cy) * PERSP / ((cy - oy) * Math.sin(NEIGUNG) + Math.cos(NEIGUNG) * PERSP);   // Abstand von der Unterkante
    const lx = ox + (cx - ox) * (PERSP + v * Math.sin(NEIGUNG)) / PERSP;
    return { x: (lx - (ox - W * scale / 2)) / scale, y: H - v / scale };
  }
  // Abzug nur, wenn er etwas tut und genau getroffen wird – sonst ist der Tipp ein Flipper-Tipp:
  // wartende Kugel (kleiner Kreis um die Kugel), geladene Kanone (Tipp auf die Kanone), Wahl-Menü (Rinne unten)
  function imAbzugFeld(cx, cy) {
    const p = tischPunkt(cx, cy), nah = (x, y, r) => Math.hypot(p.x - x, p.y - y) < r;
    if (wahl) return nah(SHOOT_X, SHOOT_Y, 30);
    if (kanone.kugel && nah(kanone.x, kanone.y, 40)) return true;
    return abschussBereit() && nah(SHOOT_X, SHOOT_Y, 26);
  }

  // Tastatur (Desktop): ← / → oder Z / M für die Flipper, Leertaste = Abzug
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.key === 'ArrowLeft' || e.key === 'z') { if (wahlBewegen(-1)) return; sfx.flipper(); gassenWechsel(-1); flippers[0].on = true; }
    if (e.key === 'ArrowRight' || e.key === 'm') { if (wahlBewegen(1)) return; sfx.flipper(); gassenWechsel(1); flippers[1].on = true; }
    if (e.key === ' ') { e.preventDefault(); abzug(); }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'z') flippers[0].on = false;
    if (e.key === 'ArrowRight' || e.key === 'm') flippers[1].on = false;
  });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    const pause = !document.getElementById('start').hidden;
    const sdt = dt * TEMPO;                     // Spielzeit (Zeitlupe auf echte Tischzeit)
    if (wahl && !pause) { zeit += sdt; if (zeit > wahl.bis) wahlFertig(); }
    else if (!gameOver && !pause) for (let i = 0; i < STEPS; i++) step(sdt / STEPS);
    else zeit += pause ? 0 : sdt;             // Lichtshow läuft auch bei Game over
    sfx.musik(multiball && !pause && !gameOver);
    lampenZustand(dt);
    draw(dt);
    anzeige();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Nur für automatische Tests (Node), im Browser ohne Wirkung
  if (window.__TEST__) window.__TEST__.api = { step, abzug, imAbzugFeld, tischPunkt, get ball() { return balls[0] || { x: 0, y: 0, vx: 0, vy: 0 }; },
    get balls() { return balls; }, kanone, feuer, rund, K_MITTE, K_AMP, kLage, ladeKanone,
    get rundTreffer() { return rundTreffer; }, get zeit() { return zeit; }, get jpMult() { return jpMult; }, grundLicht, jackpot, restart, starteWahl, get wahl() { return wahl; }, wahlFertig, schaedelLaden: () => { gunLit = true; }, sdrop, get gunLit() { return gunLit; }, get multiball() { return multiball; },
    get score() { return score; },
    get loaded() { return loaded; }, get chase() { return { kette: chaseKette, bis: chaseBis }; }, drops, gassenWechsel, topLanes, abschussBereit, flippers, get flucht() { return { lit: fluchtLit, geholt: fluchtGeholt, holdBonus, lanesLit }; }, MULDE, lampenZustand, draw, anzeige, get gameOver() { return gameOver; } };
})();
</script>
<script>
// ---------- Update-Mechanismus (Home-Bildschirm-App) ----------
(() => {
  const updateEl = document.getElementById('update');
  const verEl = document.getElementById('ver');
  verEl.textContent = 'v' + APP_VERSION;
  const verSplash = document.getElementById('ver-splash');
  verSplash.textContent = 'v' + APP_VERSION;
  verSplash.addEventListener('click', e => { e.stopPropagation(); checkForUpdate(true); });

  let ausTimer = null, infoTimer = null;
  function einblenden() {
    clearTimeout(ausTimer);
    updateEl.hidden = false; void updateEl.offsetWidth;
    updateEl.classList.add('an');
  }
  function ausblenden() {
    updateEl.classList.remove('an'); clearTimeout(ausTimer);
    ausTimer = setTimeout(() => { if (!updateEl.classList.contains('an')) updateEl.hidden = true; }, 380);
  }
  window.showInfo = showInfo;
  function showInfo(text, sekunden = 2) {
    updateEl.className = 'update info';
    document.getElementById('update-text').textContent = text;
    document.getElementById('update-go').hidden = true;
    einblenden();
    clearTimeout(infoTimer);
    if (sekunden) infoTimer = setTimeout(() => {
      if (updateEl.classList.contains('info')) ausblenden();
    }, sekunden * 1000);
  }
  function zeigeBanner(text) {
    updateEl.className = 'update';
    document.getElementById('update-text').textContent = text;
    document.getElementById('update-go').hidden = false;
    einblenden();
  }
  updateEl.addEventListener('click', () => { if (updateEl.classList.contains('info')) ausblenden(); });
  document.getElementById('update-go').addEventListener('click', () => location.reload());

  // Service Worker: nur wo erlaubt (GitHub Pages ja, Claude-Vorschau nein)
  let swOk = false;
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').then(() => { swOk = true; }).catch(() => {});
  }

  let checking = false, announced = null;
  async function checkForUpdate(manual = false) {
    if (checking) return;
    if (!manual && document.visibilityState !== 'visible') return;
    if (!navigator.onLine) { if (manual) showInfo('Offline – Prüfung nicht möglich'); return; }
    checking = true;
    try {
      const res = await fetch('index.html', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const m = (await res.text()).match(/APP_VERSION = '([^']+)'/);
      if (m && m[1] !== APP_VERSION) announceUpdate(m[1], manual);
      else if (m && manual) showInfo('Version ' + APP_VERSION + ' ist aktuell', 4);
      else if (manual) showInfo('Update-Prüfung nur in der App vom Home-Bildschirm', 4);
    } catch (_) {
      if (manual) showInfo(swOk ? 'Prüfung fehlgeschlagen' : 'Update-Prüfung nur in der App vom Home-Bildschirm', 4);
    } finally { checking = false; }
  }

  // Mitten im Spiel nicht neu laden: dann nur Banner mit Knopf
  function announceUpdate(v, manual) {
    if (announced === v && !manual) return;
    announced = v;
    zeigeBanner('Neue Version ' + v + ' ist da');
    const ruhig = window.spielRuht ? window.spielRuht() : true;
    if (manual || ruhig) setTimeout(() => location.reload(), manual ? 1500 : 3000);
  }

  window.addEventListener('pageshow', () => setTimeout(checkForUpdate, 800));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
  });
  verEl.addEventListener('click', e => { e.stopPropagation(); checkForUpdate(true); });

  // Nach dem Update einmal melden, was jetzt läuft
  const GESEHEN = 'flipper.gesehen';
  let vorher = null;
  try { vorher = localStorage.getItem(GESEHEN); } catch (_) {}
  if (vorher !== APP_VERSION) {
    try { localStorage.setItem(GESEHEN, APP_VERSION); } catch (_) {}
    if (vorher) setTimeout(() => showInfo('Version ' + APP_VERSION + ' ist geladen', 4), 400);
  }
})();
</script>
